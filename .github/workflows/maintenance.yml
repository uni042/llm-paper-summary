name: survey-maintenance

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/maintenance-requests/**.json'
  workflow_dispatch:

permissions:
  contents: write

# Maintenance mutates broad queue/index state. Serialize it with other heavyweight
# background writers without blocking claim or immutable-submission fast lanes.
concurrency:
  group: survey-background-main
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main before maintenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select pending immutable maintenance request
        id: request
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path

          request_dir = Path('.survey/work-queue/maintenance-requests')
          result_dir = Path('.survey/work-queue/maintenance-results')
          request_dir.mkdir(parents=True, exist_ok=True)
          result_dir.mkdir(parents=True, exist_ok=True)

          pending = [
              path
              for path in sorted(request_dir.glob('*.json'))
              if not (result_dir / path.name).is_file()
          ]

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              if not pending:
                  f.write('pending=false\n')
              else:
                  request_path = pending[0]
                  request = json.loads(request_path.read_text(encoding='utf-8'))
                  request_id = request.get('request_id')
                  if request.get('schema_version') != 1:
                      raise ValueError('unsupported maintenance request schema_version')
                  if request.get('kind') != 'daily_maintenance':
                      raise ValueError('unsupported maintenance request kind')
                  if request.get('worker_id') != 'scheduled-chat-30':
                      raise ValueError('08:30 maintenance request requires scheduled-chat-30')
                  if str(request.get('scheduled_slot')) != '0830':
                      raise ValueError('08:30 maintenance request requires scheduled_slot=0830')
                  if not isinstance(request_id, str) or not re.fullmatch(r'[A-Za-z0-9._-]+', request_id):
                      raise ValueError('unsafe maintenance request_id')
                  if request_path.stem != request_id:
                      raise ValueError('maintenance request filename/request_id mismatch')

                  state_path = Path('.survey/work-queue/maintenance-cycle.json')
                  state = json.loads(state_path.read_text(encoding='utf-8'))
                  state['maintenance_pending'] = True
                  state['active_request_id'] = request_id
                  state['last_maintenance_requested_at'] = request.get(
                      'requested_at',
                      dt.datetime.now(dt.timezone.utc).isoformat(),
                  )
                  state_path.write_text(
                      json.dumps(state, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )

                  f.write('pending=true\n')
                  f.write(f'request_id={request_id}\n')
                  f.write(f'request_path={request_path.as_posix()}\n')
          PY

      - name: Install survey dependencies
        if: steps.request.outputs.pending == 'true'
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Rebuild worker run-state cache from canonical facts
        if: steps.request.outputs.pending == 'true'
        continue-on-error: true
        run: python .survey/scripts/derive_worker_run_state.py --repo-root . --rebuild-cache

      - name: Compact settled worker transport
        if: steps.request.outputs.pending == 'true'
        continue-on-error: true
        run: |
          python .survey/scripts/compact_worker_transport.py \
            --repo-root . \
            --apply \
            --min-age-seconds 7200 \
            --report .survey/reports/transport-compact-latest.json

      - name: Run full GC
        if: steps.request.outputs.pending == 'true'
        run: |
          python .survey/scripts/full_gc.py \
            --repo-root . \
            --apply \
            --report .survey/reports/full-gc-latest.json

      - name: Rebuild derived paper indexes
        if: steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort -u > /tmp/pre-index-diff.txt
          python .survey/scripts/survey.py --root .survey build
          git restore .survey/survey-state/paper-identity-index.json 2>/dev/null || true
          git diff --name-only | sort -u > /tmp/post-index-diff.txt
          comm -13 /tmp/pre-index-diff.txt /tmp/post-index-diff.txt > /tmp/derived-index-drift.txt || true
          echo 'Derived index files repaired:'
          cat /tmp/derived-index-drift.txt || true

      - name: Run quality regression audits
        if: steps.request.outputs.pending == 'true'
        run: |
          python .survey/scripts/audit_paper_quality.py \
            --no-fail-exit \
            --markdown-out /tmp/paper-quality-audit.md \
            --json-out /tmp/paper-quality-audit.json
          python .survey/scripts/audit_list_summary_quality.py \
            --no-fail-exit \
            --markdown-out /tmp/list-summary-quality-audit.md \
            --json-out /tmp/list-summary-quality-audit.json
          python .survey/scripts/audit_overview_results.py \
            --no-fail-exit \
            --markdown-out /tmp/overview-result-quality-audit.md \
            --json-out /tmp/overview-result-quality-audit.json

      - name: Normalize nullable required metadata
        if: steps.request.outputs.pending == 'true'
        run: python .survey/scripts/normalize_required_metadata.py --repo-root . --apply

      - name: Refresh metadata coverage
        if: steps.request.outputs.pending == 'true'
        id: metadata
        continue-on-error: true
        run: python .survey/scripts/audit_metadata_coverage.py --repo-root . --json-out .survey/reports/metadata-coverage-latest.json --strict

      - name: Audit queue, state, quality regressions, and report freshness
        if: steps.request.outputs.pending == 'true'
        id: health
        shell: bash
        run: |
          set +e
          python .survey/scripts/maintenance_health.py \
            --root . \
            --paper-quality /tmp/paper-quality-audit.json \
            --list-quality /tmp/list-summary-quality-audit.json \
            --overview-quality /tmp/overview-result-quality-audit.json \
            --index-drift-file /tmp/derived-index-drift.txt \
            --repair-snapshot \
            --fail-on-error \
            --report .survey/reports/maintenance-health-latest.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build post-maintenance inventory
        if: steps.request.outputs.pending == 'true'
        run: |
          python .survey/scripts/build_repository_inventory.py \
            --root . \
            --output /tmp/repo-inventory.json \
            --source-commit post-maintenance-working-tree

      - name: Run repository-wide consistency check
        if: steps.request.outputs.pending == 'true'
        id: consistency
        shell: bash
        run: |
          set +e
          python .survey/scripts/check_repository.py \
            --root . \
            --inventory /tmp/repo-inventory.json \
            --report .survey/reports/consistency-latest.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Finalize maintenance state
        if: steps.request.outputs.pending == 'true'
        env:
          MAINTENANCE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          MAINTENANCE_REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          state_path = Path('.survey/work-queue/maintenance-cycle.json')
          state = json.loads(state_path.read_text())
          gc = json.loads(Path('.survey/reports/full-gc-latest.json').read_text())
          health = json.loads(Path('.survey/reports/maintenance-health-latest.json').read_text())
          consistency = json.loads(Path('.survey/reports/consistency-latest.json').read_text())
          metadata = json.loads(Path('.survey/reports/metadata-coverage-latest.json').read_text())
          metadata_incomplete = int((metadata.get('summary') or {}).get('incomplete') or 0)
          state['maintenance_pending'] = False
          state['last_maintenance_completed_at'] = dt.datetime.now(dt.timezone.utc).isoformat()
          state['last_gc_deleted'] = gc.get('deleted_count', 0)
          state['last_gc_checked_at'] = gc.get('checked_at')
          state['last_health_status'] = health.get('status')
          state['last_health_checked_at'] = health.get('checked_at')
          state['last_health_errors'] = health.get('error_count', 0)
          state['last_health_warnings'] = health.get('warning_count', 0)
          state['last_queue_snapshot_repaired'] = bool(health.get('queue', {}).get('snapshot_repaired'))
          state['last_index_repairs'] = health.get('derived_indexes', {}).get('repair_count', 0)
          state['last_quality_regressions'] = sum(
              len(v) for v in health.get('quality', {}).get('new_failures', {}).values()
              if isinstance(v, list)
          )
          state['last_metadata_status'] = 'passed' if metadata_incomplete == 0 else 'issues_found'
          state['last_metadata_checked_at'] = metadata.get('checked_at')
          state['last_metadata_incomplete'] = metadata_incomplete
          state['last_consistency_status'] = consistency.get('status')
          state['last_consistency_checked_at'] = consistency.get('checked_at')
          state['last_maintenance_status'] = (
              'passed'
              if (
                  consistency.get('status') == 'passed'
                  and health.get('status') == 'passed'
                  and metadata_incomplete == 0
              )
              else 'issues_found'
          )
          state['last_maintenance_status_source'] = 'maintenance_workflow'
          request_id = os.environ['MAINTENANCE_REQUEST_ID']
          request_path = os.environ['MAINTENANCE_REQUEST_PATH']
          state['maintenance_pending'] = False
          state.pop('active_request_id', None)
          state['last_maintenance_request_id'] = request_id
          completed_at = state['last_maintenance_completed_at']
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')

          result_dir = Path('.survey/work-queue/maintenance-results')
          result_dir.mkdir(parents=True, exist_ok=True)
          result = {
              'schema_version': 1,
              'ok': True,
              'kind': 'daily_maintenance',
              'request_id': request_id,
              'request_path': request_path,
              'completed_at': completed_at,
              'gc_deleted': state.get('last_gc_deleted', 0),
              'health_status': state.get('last_health_status'),
              'metadata_status': state.get('last_metadata_status'),
              'consistency_status': state.get('last_consistency_status'),
              'maintenance_status': state.get('last_maintenance_status'),
          }
          (result_dir / f'{request_id}.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit maintenance results
        if: steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'survey-maintenance: GC, reconcile, and health audit'
          for push_attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Maintenance results conflict with newer main; rerun maintenance from the new state.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Maintenance push race on attempt ${push_attempt}; retrying after refetch."
            sleep $((push_attempt * 2))
          done
          echo 'Failed to publish maintenance results after 5 retries.' >&2
          exit 1

      - name: Surface maintenance audit failures
        if: always() && steps.request.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          health_rc='${{ steps.health.outputs.exit_code }}'
          consistency_rc='${{ steps.consistency.outputs.exit_code }}'
          metadata_outcome='${{ steps.metadata.outcome }}'
          if [[ "${health_rc:-1}" != "0" || "${consistency_rc:-1}" != "0" || "$metadata_outcome" != "success" ]]; then
            echo "Maintenance persisted its reports/state, but one or more audits found issues." >&2
            echo "health_exit=${health_rc:-missing} consistency_exit=${consistency_rc:-missing} metadata_outcome=${metadata_outcome:-missing}" >&2
            exit 1
          fi
