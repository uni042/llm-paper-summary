name: Survey scheduler watchdog

# DISABLED 2026-11-20 (redesign Phase 0, item B1).
# The self-chained watchdog existed to drive ten-minute orchestrator ticks for
# a multi-worker fleet. Muse is now the only submitter and the orchestrator
# runs on push events plus an hourly cron, so the watchdog chain only burned
# Actions time waiting. The schedule and push triggers are removed and the
# keepalive/handoff steps are gone, so any already-running chain ends with its
# current run. To restore the watchdog, put back the previous version of this
# file (schedule '13,43 * * * *', push triggers, keepalive + handoff steps).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Watchdog disabled
        shell: bash
        run: |
          echo 'Survey scheduler watchdog is disabled (2026-11-20 redesign Phase 0).'
          echo 'The orchestrator is driven by push events and an hourly cron.'
          echo 'This run intentionally does nothing and does not hand off a successor.'
