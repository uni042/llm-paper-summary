name: Temporary apply validation and telemetry fix v5

on:
  push:
    branches: [fix/validation-preflight-and-claim-telemetry-20260913]
    paths:
      - '.github/workflows/tmp-apply-validation-telemetry-fix-v5.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validation-preflight-and-claim-telemetry-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt
      - name: Build corrected implementation script from v3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          doc = yaml.safe_load(Path('.github/workflows/tmp-apply-validation-telemetry-fix-v3.yml').read_text(encoding='utf-8'))
          steps = doc['jobs']['patch-test-commit']['steps']
          run = next(step['run'] for step in steps if step.get('name') == 'Apply implementation')
          start_marker = "          old = '''        if result_path.exists():"
          start = run.index(start_marker, run.index('claim counters marker mismatch'))
          end_marker = "          if t.count('            assigned += len(recovered)')"
          end = run.index(end_marker, start)
          replacement_lines = [
              "          old = '            for item in existing.get(\"assignments\", []) if isinstance(existing, dict) else []:\\n                if isinstance(item, dict):\\n                    assigned += 1\\n'",
              "          new = '            if isinstance(existing, dict) and isinstance(existing.get(\"assignments\"), list):\\n                assigned_reused += sum(1 for item in existing[\"assignments\"] if isinstance(item, dict))\\n'",
              "          if t.count(old) != 1:",
              "              raise SystemExit(f'claim reused telemetry block count={t.count(old)}')",
              "          t = t.replace(old, new, 1)",
          ]
          replacement = '\n'.join(replacement_lines) + '\n'
          run = run[:start] + replacement + run[end:]
          Path('/tmp/apply-implementation.sh').write_text(run, encoding='utf-8')
          PY
          bash /tmp/apply-implementation.sh
      - name: Focused tests
        run: |
          python -m compileall -q .survey/scripts
          python -m unittest discover -s .survey/tests -p 'test_validation_issue_collection.py'
          python -m unittest discover -s .survey/tests -p 'test_claim_telemetry.py'
      - name: Full verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          python -m unittest discover -s .survey/tests -p 'test_*.py'
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .survey/scripts/assemble_research_record.py \
                  .survey/scripts/preflight_chat_record.py \
                  .survey/scripts/process_immutable_submission.py \
                  .survey/scripts/isolate_failed_immutable_submission.py \
                  .survey/scripts/queue_worker.py \
                  .survey/scripts/claim_worker.py
          git diff --cached --check
          git commit -m 'fix: aggregate record validation and clarify claim telemetry'
          git push origin HEAD:fix/validation-preflight-and-claim-telemetry-20260913
