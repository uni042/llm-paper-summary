name: Retry adopted Library checkpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-adopted-library-checkpoints.yml'
      - '.survey/scripts/retry_adopted_checkpoint_submissions.py'
      - '.survey/scripts/library_ack_manifest.py'
  workflow_dispatch:
  schedule:
    - cron: '4/10 * * * *'

permissions:
  contents: write

concurrency:
  group: survey-background-main
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Validate retry helper syntax
        run: |
          python -m py_compile \
            .survey/scripts/retry_adopted_checkpoint_submissions.py \
            .survey/scripts/library_ack_manifest.py

      - name: Retry checkpoint-adopted stale attempts
        run: |
          python .survey/scripts/retry_adopted_checkpoint_submissions.py \
            --repo-root . \
            --max-items 200 \
            --parallelism 4 | tee /tmp/adopted-checkpoint-retry.json

      - name: Refresh Library acknowledgement manifest in worktree
        run: |
          python .survey/scripts/library_ack_manifest.py \
            --repo-root . \
            --output .survey/work-queue/library-ack-manifest.json

      - name: Commit and publish retry results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git fetch origin main

          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add -A
            git commit -m 'survey-helper: retry adopted Library checkpoints'
          elif [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo 'No adopted checkpoint retries or acknowledgement changes.'
            exit 0
          else
            echo 'Worktree is clean, but local rebound pin commits need publication.'
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent main update blocked a safe rebase; retry on the next scheduled run.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying."
            sleep $((attempt * 2))
          done

          echo 'Failed to publish adopted checkpoint retry state after retries.' >&2
          exit 1
