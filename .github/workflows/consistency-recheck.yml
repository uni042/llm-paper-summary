name: survey-consistency-recheck-once

on:
  push:
    paths:
      - '.survey/work-queue/consistency-recheck-request.json'

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Build tracked inventory
        run: |
          python - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(['git', 'ls-files', '-s', '-z']).decode('utf-8')
          files = []
          for item in raw.split('\0'):
              if not item:
                  continue
              meta, path = item.split('\t', 1)
              mode, sha, stage = meta.split()
              files.append({'path': path, 'sha': sha, 'mode': mode})
          Path = __import__('pathlib').Path
          Path('/tmp/repo-inventory.json').write_text(json.dumps({
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'files': files,
          }, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Recheck
        id: check
        shell: bash
        run: |
          set +e
          python .survey/scripts/check_repository.py --root . --inventory /tmp/repo-inventory.json --report .survey/reports/consistency-latest.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Remove one-shot controls and commit report
        run: |
          rm -f .survey/work-queue/consistency-recheck-request.json
          rm -f .github/workflows/consistency-recheck.yml
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'survey: record post-repair consistency recheck'
          git push
      - name: Fail on findings
        if: steps.check.outputs.exit_code != '0'
        run: exit 1
