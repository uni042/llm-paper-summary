name: Benchmark Discovery Git history bootstrap

on:
  push:
    branches:
      - perf/discovery-main-only-history-20261011
    paths:
      - '.github/workflows/discovery-history-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-only-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main (one commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fetch only main history with lazy historical blobs
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          git -c protocol.version=2 fetch --unshallow --filter=blob:none --no-tags origin main
          elapsed=$(($(date +%s)-start))
          echo "TARGETED_HISTORY_FETCH_SECONDS=$elapsed"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          for marker in ENFORCED ITERATIVE_ENFORCED FIXED_SOURCE_ENFORCED REFERENCE_POOL_FIRST_ENFORCED CITATION_FIRST_ENFORCED; do
            f=".survey/work-queue/discovery-precheck/$marker"
            test -f "$f"
            commit=$(git log --diff-filter=A --format=%H -- "$f" | tail -1)
            test -n "$commit"
            git cat-file -e "$commit^{commit}"
            git merge-base --is-ancestor "$commit" HEAD
            git diff --name-only --diff-filter=A "$commit..HEAD" -- .survey/work-queue/submissions > /dev/null
            echo "MARKER_OK $marker $commit"
          done
          result=$(find .survey/work-queue/discovery-precheck/results -maxdepth 1 -type f -name 'libimp-*.json' -print -quit)
          test -n "$result"
          git log -1 --format=%ae -- "$result" | tee /tmp/precheck-bot.txt
          test -s /tmp/precheck-bot.txt
          echo "HISTORY_PROVENANCE_OK"
  baseline-full-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout all history and branches (baseline)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate baseline graph
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          echo "FULL_HISTORY_BASELINE_OK"
