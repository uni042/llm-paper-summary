name: Manual Library recovery bridge

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/manual-library-recovery-trigger.txt'

permissions:
  actions: write
  contents: read

concurrency:
  group: manual-library-recovery-bridge
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch helper and acknowledgement sequentially
        shell: bash
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local old_id new_id
            old_id="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            gh workflow run "$workflow" --ref main
            new_id=''
            for attempt in $(seq 1 30); do
              new_id="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
              if [ -n "$new_id" ] && [ "$new_id" != '0' ] && [ "$new_id" != "$old_id" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "$new_id" ] || [ "$new_id" = '0' ] || [ "$new_id" = "$old_id" ]; then
              echo "Failed to observe new workflow_dispatch run for $workflow" >&2
              exit 1
            fi
            echo "Watching $workflow run $new_id"
            gh run watch "$new_id" --exit-status
          }

          dispatch_and_wait survey-helper.yml
          dispatch_and_wait library-publication-ack.yml
