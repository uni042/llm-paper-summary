name: Discovery precheck gate

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/discovery-precheck/requests/*.json'
      - '.survey/work-queue/discovery-preload/claims/*.json'
  workflow_dispatch:
    inputs:
      request:
        description: 'Repository-relative Discovery precheck request path'
        required: false
        type: string
permissions:
  contents: write

# Foreground worker runs never share a concurrency lane. Background preload warming
# is owned by discovery-preload-warm.yml.
concurrency:
  group: discovery-precheck-foreground-${{ github.sha }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCOVERY_PRECHECK_PARALLELISM: '4'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.survey/scripts/requirements.txt'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Compile Discovery hot-path helpers
        run: |
          python -m py_compile \
            .survey/scripts/discovery_preload_queue.py \
            .survey/scripts/process_discovery_precheck.py \
            .survey/scripts/process_discovery_precheck_batch.py \
            .survey/scripts/recover_discovery_provider_failures.py \
            .survey/scripts/ensure_discovery_run_state.py \
            .survey/scripts/derive_worker_run_state.py \
            .survey/scripts/queue_worker.py

      - name: Run Discovery regression tests off the foreground hot path
        if: github.event_name != 'push'
        run: |
          python -m unittest discover \
            -s .survey/tests \
            -p 'test_discovery_preload_queue.py'
          python -m unittest discover \
            -s .survey/tests \
            -p 'test_discovery_precheck_batch.py'

      - name: Process unsettled Discovery precheck requests
        shell: bash
        env:
          MANUAL_REQUEST: ${{ inputs.request }}
        run: |
          set -euo pipefail
          git config user.name 'survey-discovery-precheck[bot]'
          git config user.email 'survey-discovery-precheck[bot]@users.noreply.github.com'

          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main

            # A direct preload claim is already exclusive and lets the worker start
            # evaluating cached candidates immediately. Materialize its formal
            # run-specific schema-v3 request behind that foreground work.
            python .survey/scripts/hot_dispatch.py --repo-root . materialize-discovery \
              | tee /tmp/direct-discovery-materialize.json

            # Preload warming is a separate workflow. This foreground lane only
            # processes run-specific worker prechecks and direct-take materialization.

            rm -rf /tmp/discovery-identities
            rm -f /tmp/discovery-rejections.json

            # Reuse the durable exclusion snapshot whenever none of its semantic
            # inputs changed since the source commit recorded in the manifest.
            # Transport-only commits should not force a full ~1.8k-paper rebuild.
            snapshot_source="$(python -c 'import json; from pathlib import Path; p=Path(".survey/work-queue/discovery-identities/_manifest.json"); print(str(json.loads(p.read_text(encoding="utf-8")).get("source_commit") or "") if p.is_file() else "")')"
            reuse_snapshot=0
            if [ -n "$snapshot_source" ] \
              && [ -f .survey/work-queue/discovery-rejections.json ] \
              && git cat-file -e "$snapshot_source^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$snapshot_source" HEAD \
              && git diff --quiet "$snapshot_source"..HEAD -- \
                   .survey/work-queue/jobs \
                   .survey/work-queue/submissions \
                   .survey/survey-state/paper-identity-index.json \
                   .survey/survey-state/identity-deltas \
                   papers \
                   .survey/scripts/build_discovery_identity_snapshot.py \
                   .survey/scripts/build_discovery_rejection_ledger.py \
                   .survey/scripts/paper_identity.py \
                   .survey/scripts/represented_paper_index.py \
                   .survey/scripts/queue_worker.py \
                   .survey/scripts/survey.py; then
              cp -a .survey/work-queue/discovery-identities /tmp/discovery-identities
              cp .survey/work-queue/discovery-rejections.json /tmp/discovery-rejections.json
              reuse_snapshot=1
              echo "Reuse durable Discovery exclusion snapshot from $snapshot_source."
            fi

            if [ "$reuse_snapshot" -ne 1 ]; then
              python .survey/scripts/build_discovery_identity_snapshot.py \
                --root .survey \
                --output /tmp/discovery-identities \
                --source-commit "$(git rev-parse HEAD)"
              python .survey/scripts/build_discovery_rejection_ledger.py \
                --root .survey \
                --output /tmp/discovery-rejections.json
            fi

            mapfile -t all_requests < <(
              find .survey/work-queue/discovery-precheck/requests -maxdepth 1 -type f -name '*.json' 2>/dev/null | sort
            )

            : > /tmp/discovery-foreground-requests.txt
            : > /tmp/discovery-preload-requests.txt
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${MANUAL_REQUEST:-}" ]; then
              case "$MANUAL_REQUEST" in
                .survey/work-queue/discovery-precheck/requests/*.json) ;;
                *) echo "Unsupported precheck request path: $MANUAL_REQUEST" >&2; exit 2 ;;
              esac
              name="$(basename "$MANUAL_REQUEST")"
              result=".survey/work-queue/discovery-precheck/results/$name"
              if [ ! -f "$result" ]; then
                case "$name" in
                  preload-*.json) printf '%s\n' "$MANUAL_REQUEST" >> /tmp/discovery-preload-requests.txt ;;
                  *) printf '%s\n' "$MANUAL_REQUEST" >> /tmp/discovery-foreground-requests.txt ;;
                esac
              fi
            else
              for request in "${all_requests[@]:-}"; do
                [ -n "$request" ] || continue
                name="$(basename "$request")"
                result=".survey/work-queue/discovery-precheck/results/$name"
                [ ! -f "$result" ] || continue
                case "$name" in
                  preload-*.json) : ;;
                  *) printf '%s\n' "$request" >> /tmp/discovery-foreground-requests.txt ;;
                esac
              done
            fi

            processed=0
            foreground_failures=0

            # Foreground worker prechecks are independent after the shared identity
            # snapshot is built. Run up to four concurrently; the batch processor
            # serializes only the short preload claim/bank mutation section.
            #
            # A normal-search Semantic Scholar provider failure is not a run stop:
            # preserve the failed request/result, create one deterministic OpenAlex
            # schema-v3 replacement for the same textual query, and execute it in
            # this same workflow invocation. Citation/preload requests are never
            # rerouted by this recovery.
            if [ -s /tmp/discovery-foreground-requests.txt ]; then
              set +e
              python .survey/scripts/process_discovery_precheck_batch.py \
                --repo-root . \
                --requests-file /tmp/discovery-foreground-requests.txt \
                --snapshot-dir /tmp/discovery-identities \
                --rejection-ledger /tmp/discovery-rejections.json \
                --parallelism "$DISCOVERY_PRECHECK_PARALLELISM"
              batch_rc=$?
              set -e
              if [ "$batch_rc" -ne 0 ] && [ "$batch_rc" -ne 1 ]; then
                echo 'Fatal Discovery precheck batch failure; refusing partial publish.' >&2
                exit "$batch_rc"
              fi
              batch_count="$(grep -cve '^[[:space:]]*$' /tmp/discovery-foreground-requests.txt || true)"
              processed=$((processed + batch_count))

              : > /tmp/discovery-provider-failover-requests.txt
              python .survey/scripts/recover_discovery_provider_failures.py \
                --repo-root . \
                --requests-file /tmp/discovery-foreground-requests.txt \
                --output-requests-file /tmp/discovery-provider-failover-requests.txt \
                | tee /tmp/discovery-provider-failover.json

              if [ -s /tmp/discovery-provider-failover-requests.txt ]; then
                set +e
                python .survey/scripts/process_discovery_precheck_batch.py \
                  --repo-root . \
                  --requests-file /tmp/discovery-provider-failover-requests.txt \
                  --snapshot-dir /tmp/discovery-identities \
                  --rejection-ledger /tmp/discovery-rejections.json \
                  --parallelism "$DISCOVERY_PRECHECK_PARALLELISM"
                failover_batch_rc=$?
                set -e
                if [ "$failover_batch_rc" -ne 0 ] && [ "$failover_batch_rc" -ne 1 ]; then
                  echo 'Fatal Discovery provider-failover batch failure; refusing partial publish.' >&2
                  exit "$failover_batch_rc"
                fi
                failover_count="$(grep -cve '^[[:space:]]*$' /tmp/discovery-provider-failover-requests.txt || true)"
                processed=$((processed + failover_count))
              fi

              set +e
              python .survey/scripts/recover_discovery_provider_failures.py \
                --repo-root . \
                --requests-file /tmp/discovery-foreground-requests.txt \
                --verify-only \
                | tee /tmp/discovery-provider-failover-verify.json
              provider_verify_rc=$?
              set -e
              if [ "$provider_verify_rc" -eq 1 ]; then
                foreground_failures=1
              elif [ "$provider_verify_rc" -ne 0 ]; then
                echo 'Fatal Discovery provider-failover verification failure.' >&2
                exit "$provider_verify_rc"
              fi
            fi

            # A foreground Discovery precheck is already durable proof of the
            # invocation identity and selected Discovery mode. Repair a missing
            # run-state request before publication, then derive the canonical state
            # against the just-produced precheck result. This prevents a worker-side
            # omission from creating a finalization/control gap.
            # Also scan recent foreground prechecks that already have results.
            # This repairs a worker omission even when the precheck itself settled
            # before this workflow invocation; the helper ignores old/inactive runs.
            python .survey/scripts/ensure_discovery_run_state.py --repo-root . \
              | tee /tmp/discovery-run-state-recovery.json
            python .survey/scripts/derive_worker_run_state.py --repo-root . \
              | tee /tmp/discovery-run-state-derive.json

            python .survey/scripts/hot_dispatch.py --repo-root . finalize-discovery \
              | tee /tmp/direct-discovery-finalize.json
            python .survey/scripts/hot_dispatch.py --repo-root . refresh \
              > /tmp/hot-dispatch.json

            if [ "$processed" -eq 0 ] && git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
              echo 'No unsettled Discovery precheck requests or preload queue changes remain.'
              exit 0
            fi

            git add \
              .survey/work-queue/discovery-precheck/requests \
              .survey/work-queue/discovery-precheck/results \
              .survey/work-queue/discovery-preload \
              .survey/work-queue/direct-take-results \
              .survey/work-queue/run-state \
              .survey/work-queue/hot-dispatch.json
            while IFS= read -r -d '' preload_slot; do
              git add -- "$preload_slot"
            done < <(
              find .survey/work-queue/records -type f \
                \( -name 'discovery-preload.json' -o -name 'research-preload.json' \) -print0
            )

            if git diff --cached --quiet; then
              echo 'No Discovery precheck changes to publish.'
              exit 0
            fi
            git commit -m 'survey: publish discovery precheck results and preload stock'

            if git push origin HEAD:main; then
              if [ "$foreground_failures" -ne 0 ]; then
                echo 'One or more foreground precheck failures were persisted with recovery guidance.' >&2
                exit 1
              fi
              exit 0
            fi

            echo "Precheck push race on attempt ${attempt}; recomputing from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            jitter=$(( RANDOM % 6 ))
            sleep $((backoff + jitter))
          done

          echo 'Failed to publish Discovery precheck results after retries.' >&2
          exit 1
