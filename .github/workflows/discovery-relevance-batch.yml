name: Incremental Discovery relevance classifier

on:
  # Best-effort GitHub cron. Every invocation handles at most one batch.
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-relevance-batch.yml'
      - '.survey/scripts/discovery_relevance_classifier.py'
      - '.survey/scripts/discovery_relevance_batch.py'
      - '.survey/config/discovery-relevance-prefilter.json'

permissions:
  contents: write

concurrency:
  group: incremental-discovery-relevance-main
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Continue bounded classifier batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Expensive model building and 2,000-paper inference must execute
          # only once. Recomputing for every optimistic push retry previously
          # took ~80 seconds; a busy main moved during each attempt.
          git fetch origin main
          git reset --hard origin/main
          python .survey/scripts/discovery_relevance_batch.py --repo-root . --batch-size 2000

          # Stage durable outputs outside the checkout. git reset --hard must
          # never erase a successfully completed classification batch.
          stage="$(mktemp -d)"
          mkdir -p "$stage"
          if [ ! -d .survey/work-queue/discovery-prefilter ]; then
            echo 'No classifier artifacts to publish.'
            exit 0
          fi
          cp -a .survey/work-queue/discovery-prefilter/. "$stage/"

          # Only this workflow owns the classifier shards (serialized by
          # concurrency group). Every retry rebases the same bounded output
          # onto the latest main in seconds instead of 80+ seconds.
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .survey/work-queue/discovery-prefilter
            cp -a "$stage"/. .survey/work-queue/discovery-prefilter/
            git add -A .survey/work-queue/discovery-prefilter/
            if git diff --cached --quiet; then
              echo 'Classifier outputs already published on main.'
              exit 0
            fi
            git commit -m 'chore: advance bounded Discovery classifier'
            if git push origin HEAD:main; then
              echo "Classifier results persisted on attempt $attempt."
              exit 0
            fi
            echo "Concurrent main push on attempt $attempt; retrying publish only."
            sleep 2
          done
          echo 'Failed to publish classifier artifacts after 20 fast retries' >&2
          exit 1
