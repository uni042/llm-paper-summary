name: Survey completed descriptor builder fast lane

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/completed-submission-requests/*.json'
      - '.github/workflows/survey-completed-builder-fast.yml'
  schedule:
    - cron: '9/10 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: survey-completed-builder-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce completed request contract in worker router
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-completed-builder[bot]'
          git config user.email 'survey-completed-builder[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          path = Path('.survey/docs/survey-workflow/worker-router.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "2. attempt固有descriptorを `.survey/work-queue/submissions/research/<attempt_id>.json` または `audit/<attempt_id>.json` にcommitする。**新規submissionのファイル名stemはdescriptor内の `attempt_id` と完全一致させる。** status-only `blocked` / `deferred` / `rejected` も同じsubmission laneへ送る。過去に存在する任意名descriptorは読取互換のみ残してよいが、新規生成しない。":
              "2. `status=completed` はdescriptorを手組みせず、`.survey/work-queue/completed-submission-requests/<attempt_id>.json` にrequestをcommitする。requestのファイル名stemは `attempt_id` と完全一致させ、`kind` / `attempt_id` / `job_id` / `record_bank` と、必要なら `paper_path` / `expected_blob_sha` を持たせる。このpushまたは10分周期の `.github/workflows/survey-completed-builder-fast.yml` が `prepare_completed_submission.py` を実行し、実blob SHAを取得・検証したattempt固有descriptorを `.survey/work-queue/submissions/research/<attempt_id>.json` または `audit/<attempt_id>.json` に生成する。**completed descriptorをScheduled Chatが直接作成・更新してはならない。** status-only `blocked` / `deferred` / `rejected` だけは従来どおり最小descriptorをsubmission laneへ直接送る。過去の直接completed descriptorは読取互換のみ残し、新規生成しない。",
              "8. GitHubへ保存可能なら各スロットの実blob SHAを取得し、attempt固有の不変descriptorを `.survey/work-queue/submissions/research/<attempt_id>.json` または `audit/<attempt_id>.json` へ保存する。新規descriptorのファイル名stemは必ず `attempt_id` と一致させる。":
              "8. GitHubへ保存可能なら、`status=completed` はattempt固有requestを `.survey/work-queue/completed-submission-requests/<attempt_id>.json` へ保存し、completed builder fast laneに実blob SHA取得・検証済みdescriptor生成を委ねる。Scheduled Chatがcompleted descriptorを `.survey/work-queue/submissions/research/` / `audit/` へ直接保存してはならない。status-only `blocked` / `deferred` / `rejected` は第3.1節4項の最小descriptorを従来どおりsubmission laneへ直接保存する。"
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'worker-router contract anchor not found: {old[:80]}')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- .survey/docs/survey-workflow/worker-router.md; then
            echo 'Worker router already enforces completed request contract.'
          else
            git add .survey/docs/survey-workflow/worker-router.md
            git commit -m 'survey: require completed submission builder requests'
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              echo "Router migration push race on attempt ${attempt}; rebasing onto latest main." >&2
              sleep $((attempt * 2))
              git fetch origin main
              git rebase origin/main
            done
            git fetch origin main
            git reset --hard origin/main
          fi

      - name: Build validated completed descriptors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'survey-completed-builder[bot]'
          git config user.email 'survey-completed-builder[bot]@users.noreply.github.com'

          # Treat request files as a durable queue. Push handles the common fast path;
          # the periodic run recovers requests stranded by a cancelled/failed push run.
          mkdir -p .survey/work-queue/completed-submission-requests
          mapfile -t requests < <(find .survey/work-queue/completed-submission-requests -maxdepth 1 -type f -name '*.json' -print | sort)
          if [ "${#requests[@]}" -eq 0 ]; then
            echo 'No completed-submission requests exist.'
            exit 0
          fi

          : > /tmp/built-submissions.txt
          built=0
          for request in "${requests[@]}"; do
            request_id="$(basename "$request" .json)"
            kind="$(jq -er '.kind' "$request")"
            attempt_id="$(jq -er '.attempt_id' "$request")"
            job_id="$(jq -er '.job_id' "$request")"
            record_bank="$(jq -er '.record_bank' "$request")"
            paper_path="$(jq -r '.paper_path // empty' "$request")"
            expected_blob_sha="$(jq -r '.expected_blob_sha // empty' "$request")"

            case "$kind" in research|audit) ;; *) echo "unsupported kind: $kind" >&2; exit 1 ;; esac
            if [ "$request_id" != "$attempt_id" ]; then
              echo "request filename must equal attempt_id: ${request_id} != ${attempt_id}" >&2
              exit 1
            fi
            output=".survey/work-queue/submissions/${kind}/${attempt_id}.json"
            if [ -e "$output" ]; then
              echo "completed descriptor already exists; request is settled: $output"
              continue
            fi
            args=(
              python .survey/scripts/prepare_completed_submission.py
              --repo-root .
              --kind "$kind"
              --attempt-id "$attempt_id"
              --job-id "$job_id"
              --record-bank "$record_bank"
              --output "$output"
            )
            if [ -n "$paper_path" ]; then args+=(--paper-path "$paper_path"); fi
            if [ -n "$expected_blob_sha" ]; then args+=(--expected-blob-sha "$expected_blob_sha"); fi
            "${args[@]}"
            printf '%s\n' "$output" >> /tmp/built-submissions.txt
            built=$((built + 1))
          done

          if [ "$built" -eq 0 ]; then
            echo 'All completed-submission requests are already settled.'
            exit 0
          fi

          git add .survey/work-queue/submissions/research .survey/work-queue/submissions/audit
          if git diff --cached --quiet; then
            echo 'No new completed descriptors were generated.'
            exit 0
          fi
          git commit -m 'survey-submission: build validated completed descriptors'

          published=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              published=1
              break
            fi
            echo "Builder push race on attempt ${attempt}; refusing to hand-merge generated descriptors." >&2
            sleep $((attempt * 2))
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Generated descriptor conflicts with newer main; periodic recovery will retry from fresh main.' >&2
              exit 1
            fi
          done
          if [ "$published" -ne 1 ]; then
            echo 'Failed to publish generated completed descriptors after 5 retries; periodic recovery will retry.' >&2
            exit 1
          fi

          # A push made with GITHUB_TOKEN does not recursively trigger push workflows.
          # Explicitly dispatch each freshly published immutable descriptor; the
          # submission lane's periodic drain remains the durable recovery path.
          while IFS= read -r submission; do
            [ -n "$submission" ] || continue
            gh workflow run survey-submission-fast.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f submission="$submission"
          done < /tmp/built-submissions.txt
