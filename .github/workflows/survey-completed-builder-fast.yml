name: Survey completed descriptor builder fast lane

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/completed-submission-requests/*.json'
      - '.survey/scripts/advance_research_submission_pipeline.py'
      - '.github/workflows/survey-completed-builder-fast.yml'
  schedule:
    - cron: '9/10 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: survey-completed-materialization-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify worker router preflight contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.survey/docs/survey-workflow/worker-router.md').read_text(encoding='utf-8')
          required = (
              '.survey/work-queue/research-preflight/requests/<request_id>.json',
              'preflight_passed=false',
              'preflight_result',
              'exact blob fingerprint',
              'completed-submission-failures',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('worker-router preflight contract missing: ' + ', '.join(missing))
          PY

      - name: Recover legacy completed requests without queue-wide blocking
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'survey-completed-builder[bot]'
          git config user.email 'survey-completed-builder[bot]@users.noreply.github.com'

          published=0
          built=0
          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p \
              .survey/work-queue/completed-submission-failures \
              .survey/work-queue/submissions/research \
              .survey/work-queue/submissions/audit
            python .survey/scripts/advance_research_submission_pipeline.py \
              --repo-root . \
              --mode completed \
              --manifest /tmp/completed-builder.json
            built="$(jq -r '.built_descriptors | length' /tmp/completed-builder.json)"

            python .survey/scripts/compact_worker_transport.py \
              --repo-root . \
              --apply \
              --min-age-seconds 7200 \
              --report /tmp/transport-compact.json \
              || echo 'Transport compaction failed; descriptor recovery continues and maintenance will retry.'

            git add -A \
              .survey/work-queue/completed-submission-requests \
              .survey/work-queue/completed-submission-failures \
              .survey/work-queue/research-preflight \
              .survey/work-queue/submissions/research \
              .survey/work-queue/submissions/audit \
              .survey/work-queue/run-state/cache \
              .survey/work-queue/run-state/fact-clock.json \
              .survey/work-queue/archive/transport

            if git diff --cached --quiet; then
              echo 'No new completed descriptors or isolation records to publish.'
              published=1
              break
            fi

            git commit -m 'survey-submission: recover completed descriptor queue'
            if git push origin HEAD:main; then
              published=1
              break
            fi

            echo "Builder push race on attempt ${attempt}; recomputing from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            jitter=$(( RANDOM % 6 ))
            sleep $((backoff + jitter))
          done

          if [ "$published" -ne 1 ]; then
            echo 'Failed to publish generated completed descriptors after retries.' >&2
            exit 1
          fi

          # Dispatch once for the whole batch; survey-submission-fast drains all unsettled
          # immutable descriptors with its bounded parallel batch processor.
          if [ "$built" -gt 0 ]; then
            gh workflow run survey-submission-fast.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
          fi
