name: Apply quality content fixes

on:
  push:
    paths:
      - ".survey/migrations/quality_content_fixes_*.py"
      - ".github/workflows/apply-quality-content-fixes.yml"

permissions:
  contents: write

concurrency:
  group: apply-quality-content-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply idempotent content fixes
        run: |
          for f in .survey/migrations/quality_content_fixes_*.py; do
            echo "Applying $f"
            python "$f"
          done

      - name: Run checker regression tests
        run: python -m unittest discover -s .survey/tests -p 'test_audit_paper_quality.py'

      - name: Audit updated working tree
        run: |
          mkdir -p audit-output
          python .survey/scripts/audit_paper_quality.py \
            --no-fail-exit \
            --markdown-out audit-output/paper-quality-audit.md \
            --json-out audit-output/paper-quality-audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: paper-quality-audit-after-content-fixes
          path: audit-output/
          retention-days: 7

      - name: Commit and push changes
        run: |
          if git diff --quiet -- papers/inference; then
            echo "No paper changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/inference
          git commit -m "Expand paper summaries failing content quality audit"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced while this job was running; rebasing onto latest main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Automatic rebase conflicted; refusing to overwrite concurrent changes."
              exit 1
            fi
          done

          echo "Push failed after 3 attempts."
          exit 1
