name: Branch patch reconcile

on:
  push:
    branches:
      - fix/research-audit-submission-recovery
    paths:
      - '.survey/scripts/_branch_patch_reconcile.py'
      - '.github/workflows/branch-patch-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: branch-patch-reconcile
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/research-audit-submission-recovery
          fetch-depth: 0

      - name: Apply bounded reconciliation patch
        run: python .survey/scripts/_branch_patch_reconcile.py

      - name: Commit patched files and remove temporary patch lane
        shell: bash
        run: |
          set -euo pipefail
          rm .survey/scripts/_branch_patch_reconcile.py
          rm .github/workflows/branch-patch-reconcile.yml
          git config user.name 'survey-repair[bot]'
          git config user.email 'survey-repair[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcile exact partial immutable publication'
          git push origin HEAD:fix/research-audit-submission-recovery
