name: Candidate priority refresh

on:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/candidate-priority-refresh.yml'
      - '.survey/config/candidate-priority.json'
      - '.survey/scripts/candidate_priority.py'
      - '.survey/scripts/refresh_candidate_priority.py'
      - '.survey/scripts/discovery_provider_adapter.py'
      - '.survey/scripts/queue_worker.py'
      - '.survey/scripts/build_worker_worklist.py'
      - '.survey/tests/test_candidate_priority.py'
      - '.survey/tests/test_discovery_provider_adapter.py'
      - '.survey/tests/test_queue_worker_metadata.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-priority-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Candidate priority regression tests
        run: |
          python -m unittest discover -s .survey/tests -p 'test_candidate_priority.py'
          python -m unittest discover -s .survey/tests -p 'test_discovery_provider_adapter.py'
          python -m unittest discover -s .survey/tests -p 'test_queue_worker_metadata.py'
      - name: Refresh candidate importance metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          git reset --hard origin/main

          # Semantic Scholar/OpenAlex traffic happens once per workflow run.
          # If main advances, rebase the generated cache/job update rather than
          # re-querying providers.
          python .survey/scripts/refresh_candidate_priority.py --repo-root . | tee /tmp/candidate-priority-refresh.json

          git add -A \
            .survey/work-queue/candidate-priority-cache.json \
            .survey/work-queue/jobs

          if git diff --cached --quiet; then
            echo 'Candidate priority metadata already current.'
            exit 0
          fi

          git commit -m 'survey: refresh candidate priorities'

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; rebasing generated priority state onto latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Priority state conflicts with newer queue state; defer to the next hourly refresh.' >&2
              exit 1
            fi
          done

          echo 'Failed to publish candidate priority refresh after rebasing retries.' >&2
          exit 1
