name: Survey submission fast lane

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/submissions/research/*.json'
      - '.survey/work-queue/submissions/audit/*.json'
  workflow_dispatch:
    inputs:
      submission:
        description: 'Optional repository-relative immutable descriptor; omit to drain all unsettled descriptors'
        required: false
        type: string
  schedule:
    - cron: '7/10 * * * *'

permissions:
  contents: write

concurrency:
  group: survey-submission-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBMISSION_PARALLELISM: '4'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.survey/scripts/requirements.txt'

      - name: Install survey dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Drain all unsettled immutable descriptors
        shell: bash
        env:
          MANUAL_SUBMISSION: ${{ inputs.submission }}
        run: |
          set -euo pipefail
          git config user.name 'survey-submission[bot]'
          git config user.email 'survey-submission[bot]@users.noreply.github.com'

          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main
            processing_failed=0
            : > /tmp/immutable-submissions.txt

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${MANUAL_SUBMISSION:-}" ]; then
              printf '%s\n' "$MANUAL_SUBMISSION" > /tmp/immutable-submissions.txt
            else
              python .survey/scripts/list_unsettled_immutable_submissions.py \
                --repo-root . > /tmp/immutable-submissions.txt
            fi

            if [ ! -s /tmp/immutable-submissions.txt ]; then
              echo 'No unsettled immutable research/audit descriptors remain.'
              exit 0
            fi

            while IFS= read -r path; do
              case "$path" in
                .survey/work-queue/submissions/research/*.json|.survey/work-queue/submissions/audit/*.json) ;;
                *) echo "Unsupported submission path: $path" >&2; exit 1 ;;
              esac
            done < /tmp/immutable-submissions.txt

            cat /tmp/immutable-submissions.txt
            rm -rf /tmp/submission-effects
            mkdir -p /tmp/submission-effects

            python .survey/scripts/record_run_ledger.py snapshot \
              --repo-root . \
              --snapshot /tmp/submission-fast-baseline.json

            set +e
            python .survey/scripts/process_immutable_submission_batch.py \
              --repo-root . \
              --descriptors-file /tmp/immutable-submissions.txt \
              --effects-dir /tmp/submission-effects \
              --parallelism "$SUBMISSION_PARALLELISM"
            batch_rc=$?
            set -e
            if [ "$batch_rc" -eq 1 ]; then
              processing_failed=1
            elif [ "$batch_rc" -ne 0 ]; then
              echo 'Fatal immutable submission batch failure; refusing partial commit.' >&2
              exit "$batch_rc"
            fi

            # Status-only blocked Research/Audit descriptors are per-paper
            # quarantines, not permanent exclusions. Record the retry event in
            # the same publication transaction so the seven-day retry deadline
            # is durable before the worker advances to the next standby.
            python .survey/scripts/blocked_retry.py --root .survey

            set +e
            python .survey/scripts/derive_worker_run_state.py \
              --repo-root . \
              --auto-from-descriptors-file /tmp/immutable-submissions.txt
            auto_state_rc=$?
            python .survey/scripts/compact_worker_transport.py \
              --repo-root . \
              --apply \
              --min-age-seconds 7200 \
              --report /tmp/transport-compact.json
            compact_rc=$?
            set -e
            if [ "$auto_state_rc" -ne 0 ]; then
              echo 'Automatic run-state snapshot failed; immutable submission result remains authoritative and request fast lane will recover.' >&2
            fi
            if [ "$compact_rc" -ne 0 ]; then
              echo 'Transport compaction failed; paper processing continues and maintenance will retry.' >&2
            fi

            python .survey/scripts/hot_dispatch.py --repo-root . refresh > /tmp/hot-dispatch.json
            python .survey/scripts/record_run_ledger.py record --repo-root . --snapshot /tmp/submission-fast-baseline.json
            python .survey/scripts/render_status_dashboard.py --repo-root . --output STATUS.md

            mkdir -p .survey/work-queue/results/research .survey/work-queue/results/audit
            git add -A \
              STATUS.md \
              papers \
              .survey/work-queue/jobs \
              .survey/work-queue/results/research \
              .survey/work-queue/results/audit \
              .survey/work-queue/run-state \
              .survey/work-queue/completed-submission-requests \
              .survey/work-queue/research-preflight \
              .survey/work-queue/archive \
              .survey/work-queue/claim-requests \
              .survey/work-queue/claim-results \
              .survey/work-queue/run-ledger.json \
              .survey/work-queue/state.json \
              .survey/work-queue/next-jobs.json \
              .survey/work-queue/hot-dispatch.json \
              .survey/work-queue/discovery-state.json \
              .survey/survey-state/identity-deltas

            if git diff --cached --quiet; then
              if [ "$processing_failed" -ne 0 ]; then
                echo 'Immutable submission failed without new durable state.' >&2
                exit 1
              fi
              echo 'Immutable submissions already settled.'
              exit 0
            fi

            git commit -m 'survey-submission: drain immutable research results'
            if git push origin HEAD:main; then
              if [ "$processing_failed" -ne 0 ]; then
                echo 'Immutable submission failure result was persisted to main.' >&2
                echo 'Periodic drain will retry it only when explicitly classified retryable.' >&2
                exit 1
              fi
              exit 0
            fi

            echo "Submission push race on attempt ${attempt}; recomputing all unsettled descriptors from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            jitter=$(( RANDOM % 6 ))
            sleep $((backoff + jitter))
          done

          echo 'Failed to publish immutable submission results after 12 retries.' >&2
          exit 1
