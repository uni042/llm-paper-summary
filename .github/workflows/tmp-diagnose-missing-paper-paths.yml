name: Temporary diagnose completed jobs missing paper paths

on:
  push:
    branches: [cleanup/backfill-completed-job-paper-paths-20260913]
    paths:
      - '.github/workflows/tmp-diagnose-missing-paper-paths.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/backfill-completed-job-paper-paths-20260913
          fetch-depth: 0

      - name: Strictly re-audit completed job paper path candidates
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          repo = Path('.')
          jobs_root = repo / '.survey/work-queue/jobs'
          claims_root = repo / '.survey/work-queue/claims'
          reusable_submission = '.survey/work-queue/submissions/chat-inbox.json'
          reusable_result = '.survey/work-queue/results/chat-inbox.json'

          def load_path(path):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return None

          def submission_path(raw):
              if not isinstance(raw, str) or not raw.strip():
                  return None
              raw = raw.strip().replace('\\', '/')
              if raw.startswith('.survey/'):
                  return repo / raw
              if raw.startswith('work-queue/'):
                  return repo / '.survey' / raw
              return None

          def result_path(sub_path):
              if sub_path is None:
                  return None
              rel = sub_path.as_posix()
              marker = '.survey/work-queue/submissions/'
              if marker not in rel:
                  return None
              return Path(rel.replace(marker, '.survey/work-queue/results/', 1))

          def result_paper(result):
              if not isinstance(result, dict):
                  return None
              artifact = result.get('artifact')
              if isinstance(artifact, dict):
                  return artifact.get('paper')
              return artifact if isinstance(artifact, str) else None

          def valid_paper(paper):
              return (
                  isinstance(paper, str)
                  and paper.startswith('papers/')
                  and '..' not in Path(paper).parts
                  and (repo / paper).is_file()
              )

          def attempt_compatible(submission, result):
              sa = submission.get('attempt_id') if isinstance(submission, dict) else None
              ra = result.get('attempt_id') if isinstance(result, dict) else None
              return not (sa and ra and sa != ra)

          def history(path):
              proc = subprocess.run(
                  ['git', 'log', '--format=%H', '--', path],
                  check=True, text=True, capture_output=True,
              )
              out = []
              seen = set()
              for sha in proc.stdout.splitlines():
                  show = subprocess.run(
                      ['git', 'show', f'{sha}:{path}'],
                      text=True, capture_output=True,
                  )
                  if show.returncode != 0:
                      continue
                  try:
                      payload = json.loads(show.stdout)
                  except Exception:
                      continue
                  fingerprint = json.dumps(payload, ensure_ascii=False, sort_keys=True)
                  if fingerprint in seen:
                      continue
                  seen.add(fingerprint)
                  out.append((sha, payload))
              return out

          submission_history = history(reusable_submission)
          result_history = history(reusable_result)

          active_claims = []
          for claim_file in sorted(claims_root.glob('*.json')):
              claim = load_path(claim_file)
              if isinstance(claim, dict) and not claim.get('released_at'):
                  active_claims.append({
                      'file': claim_file.as_posix(),
                      'job_id': claim.get('job_id'),
                      'claim_id': claim.get('claim_id'),
                      'request_id': claim.get('request_id'),
                      'expires_at': claim.get('expires_at'),
                  })

          missing = []
          candidates = []
          unresolved = []
          for job_file in sorted(jobs_root.glob('*.json')):
              job = load_path(job_file)
              if not isinstance(job, dict):
                  continue
              if job.get('status') != 'completed' or job.get('type') not in {'research', 'audit'}:
                  continue
              if job.get('paper_path'):
                  continue

              jid = job.get('job_id')
              base = {
                  'job_id': jid,
                  'job_file': job_file.as_posix(),
                  'type': job.get('type'),
                  'status': job.get('status'),
                  'artifact_submission': job.get('artifact_submission'),
              }
              missing.append(dict(base))

              sp = submission_path(job.get('artifact_submission'))
              rp = result_path(sp)
              desc = load_path(sp) if sp and sp.is_file() else None
              result = load_path(rp) if rp and rp.is_file() else None
              paper = desc.get('paper_path') if isinstance(desc, dict) else None
              if (
                  isinstance(desc, dict)
                  and desc.get('job_id') == jid
                  and desc.get('status') == 'completed'
                  and valid_paper(paper)
                  and isinstance(result, dict)
                  and result.get('ok') is True
                  and result.get('job_id') == jid
                  and attempt_compatible(desc, result)
                  and result_paper(result) == paper
              ):
                  row = dict(base)
                  row.update({
                      'paper_path': paper,
                      'paper_exists': True,
                      'submission_status': desc.get('status'),
                      'submission_attempt_id': desc.get('attempt_id'),
                      'result_attempt_id': result.get('attempt_id'),
                      'evidence': 'current_submission_and_result',
                      'submission': sp.as_posix(),
                      'result': rp.as_posix(),
                      'distinct_paper_count': 1,
                  })
                  candidates.append(row)
                  continue

              if job.get('artifact_submission') not in {'work-queue/submissions/chat-inbox.json', reusable_submission}:
                  row = dict(base)
                  row['reason'] = 'no_current_exact_success_and_not_legacy_reusable'
                  unresolved.append(row)
                  continue

              desc_versions = []
              for sha, payload in submission_history:
                  if not isinstance(payload, dict) or payload.get('job_id') != jid:
                      continue
                  if payload.get('status') != 'completed':
                      continue
                  p = payload.get('paper_path')
                  if valid_paper(p):
                      desc_versions.append((sha, payload))

              result_versions = []
              for sha, payload in result_history:
                  if not isinstance(payload, dict):
                      continue
                  if payload.get('ok') is not True or payload.get('job_id') != jid:
                      continue
                  p = result_paper(payload)
                  if valid_paper(p):
                      result_versions.append((sha, payload))

              matches = []
              for dsha, dpayload in desc_versions:
                  dpaper = dpayload.get('paper_path')
                  for rsha, rpayload in result_versions:
                      if result_paper(rpayload) != dpaper:
                          continue
                      if not attempt_compatible(dpayload, rpayload):
                          continue
                      matches.append({
                          'paper_path': dpaper,
                          'paper_exists': True,
                          'submission_status': dpayload.get('status'),
                          'submission_attempt_id': dpayload.get('attempt_id'),
                          'result_attempt_id': rpayload.get('attempt_id'),
                          'attempt_id': dpayload.get('attempt_id') or rpayload.get('attempt_id'),
                          'submission_commit': dsha,
                          'result_commit': rsha,
                      })

              distinct = {}
              for match in matches:
                  distinct.setdefault(match['paper_path'], match)
              if len(distinct) == 1:
                  match = next(iter(distinct.values()))
                  row = dict(base)
                  row.update(match)
                  row.update({
                      'evidence': 'git_history_submission_and_success_result',
                      'descriptor_versions': len(desc_versions),
                      'success_result_versions': len(result_versions),
                      'matching_pairs': len(matches),
                      'distinct_paper_count': len(distinct),
                  })
                  candidates.append(row)
              else:
                  row = dict(base)
                  row.update({
                      'reason': 'no_unique_historical_success_match',
                      'descriptor_versions': len(desc_versions),
                      'success_result_versions': len(result_versions),
                      'matching_pairs': len(matches),
                      'matched_papers': sorted(distinct),
                      'distinct_paper_count': len(distinct),
                  })
                  unresolved.append(row)

          duplicate_jobs = sorted({x['job_id'] for x in candidates if sum(y['job_id'] == x['job_id'] for y in candidates) > 1})
          report = {
              'head': subprocess.run(['git', 'rev-parse', 'HEAD'], check=True, text=True, capture_output=True).stdout.strip(),
              'active_claim_count': len(active_claims),
              'active_claims': active_claims,
              'missing_count': len(missing),
              'candidate_count': len(candidates),
              'unresolved_count': len(unresolved),
              'duplicate_candidate_jobs': duplicate_jobs,
              'candidates': candidates,
              'unresolved': unresolved,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if unresolved or duplicate_jobs or len(candidates) != len(missing):
              raise SystemExit('strict audit did not produce a unique safe candidate for every missing job')
          PY
