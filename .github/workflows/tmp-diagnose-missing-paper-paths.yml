name: Temporary apply audited completed-job paper paths

on:
  push:
    branches: [cleanup/backfill-completed-job-paper-paths-20260913]
    paths:
      - '.github/workflows/tmp-diagnose-missing-paper-paths.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/backfill-completed-job-paper-paths-20260913
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository test dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Guard audited base and latest main
        run: |
          git fetch origin main cleanup/backfill-completed-job-paper-paths-20260913
          test "$(git rev-parse origin/main)" = "606f47bf32e8d0eb3d9a045915dd867efed947b9"
          test "$(git rev-parse HEAD^)" = "653da4d29fe9169d20e6aa648df579789c904ff2"
          git merge-base --is-ancestor origin/main HEAD
          git diff --quiet 653da4d29fe9169d20e6aa648df579789c904ff2 -- .survey/work-queue/jobs papers .survey/work-queue/submissions .survey/work-queue/results

      - name: Backfill only strictly audited completed jobs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mapping = {
              'job-research-1587413c3d872e20': 'papers/inference/99-other-inference-systems/2026-2609.03236-speculative-macro-commit-for-faster-tool-using-agents.md',
              'job-research-175c317515b75ca5': 'papers/inference/07-kv-cache-optimization-compression/2026-2606.02964-multi-segment-attention-enabling-efficient-kv-cache-management-for-faster-large-language-model-serving.md',
              'job-research-176f6ec6b8273a5c': 'papers/inference/02-hardware-accelerators/2026-2607.10186-flashaccel-high-bandwidth-flash-llm-inference.md',
              'job-research-569c68f713c406a9': 'papers/inference/11-llm-serving-scheduling-disaggregation/2025-2508.19559-heteroscale-coordinated-autoscaling.md',
              'job-research-5b8bc3f2f1ab32c5': 'papers/inference/07-kv-cache-optimization-compression/2026-2609.07966-metakv-adaptive-kv-cache-compression-for-constrained-llm-inference.md',
              'job-research-5f3928ac49560aeb': 'papers/inference/99-other-inference-systems/2026-2603.17435-zipserv-fast-memory-efficient-llm-inference-hardware-aware-lossless-compression.md',
              'job-research-651c768da8e5f9fc': 'papers/inference/10-kv-cache-offload-recomputation/2026-2608.11231-linearkv-position-independent-caching-hybrid-llms.md',
              'job-research-67fd071bb1792a36': 'papers/inference/01-offload-hierarchical-memory/2026-2607.07388-tf-engram-ssd-backed-memory.md',
              'job-research-821890bf5e9d5e8e': 'papers/survey/03-inference-engines/2025-2506.21901-survey-llm-inference-systems.md',
              'job-research-a190f4e7421fc3f8': 'papers/inference/11-llm-serving-scheduling-disaggregation/2026-2602.12151-oserve-spatial-temporal-workload-orchestration.md',
              'job-research-a297f1776b1a8b16': 'papers/inference/10-kv-cache-offload-recomputation/2026-2604.18529-hybridgen-efficient-llm-generative-inference-via-cpu-gpu-hybrid-computing.md',
              'job-research-bb4463d4f717f17c': 'papers/inference/99-other-inference-systems/2026-2608.26612-launch-bound-and-substitutable-moe-inference-optimizations.md',
              'job-research-c17cf648935fd5ee': 'papers/inference/11-llm-serving-scheduling-disaggregation/2025-2512.04013-augserve-adaptive-request-scheduling-augmented-llm-inference-serving.md',
              'job-research-c7635853ef551bb8': 'papers/inference/11-llm-serving-scheduling-disaggregation/2026-2510.13668-star-decode-phase-rescheduling-for-llm-inference.md',
              'job-research-cf1831adcf0d875d': 'papers/inference/10-kv-cache-offload-recomputation/2024-2405.16444-cacheblend-fast-rag-kv-cache-fusion.md',
              'job-research-ee6da232bd76e206': 'papers/inference/08-edge-on-device-llm-systems/2026-2606.10493-achieving-cloud-grade-slos-for-local-mixture-of-experts-inference-through-cpu-gpu-hybrid-design.md',
              'job-research-eeddee746504f3dd': 'papers/inference/07-kv-cache-optimization-compression/2024-2410.16179-magicpig-lsh-sampling-efficient-llm-generation.md',
              'job-research-f3407b821f3f7dcf': 'papers/inference/11-llm-serving-scheduling-disaggregation/2026-2607.00151-smoothagent-lookahead-context-engineering.md',
              'job-research-f9f62bef5889e903': 'papers/inference/05-speculative-decoding-moe/2026-2602.16052-moe-spec-expert-budgeting-speculative-decoding.md',
              'job-research-fcb9e0b363722b52': 'papers/inference/05-speculative-decoding-moe/2026-2607.24434-draftexpert-expansion-aware-self-speculative-decoding.md',
          }

          jobs_root = Path('.survey/work-queue/jobs')
          for job_id, paper_path in mapping.items():
              job_file = jobs_root / f'{job_id}.json'
              if not job_file.is_file():
                  raise SystemExit(f'missing job file: {job_file}')
              if not Path(paper_path).is_file():
                  raise SystemExit(f'missing audited paper: {paper_path}')
              job = json.loads(job_file.read_text(encoding='utf-8'))
              if job.get('job_id') != job_id:
                  raise SystemExit(f'job id mismatch: {job_file}')
              if job.get('status') != 'completed':
                  raise SystemExit(f'job is no longer completed: {job_id}')
              if job.get('type') not in {'research', 'audit'}:
                  raise SystemExit(f'unexpected job type: {job_id}: {job.get("type")}')
              if job.get('paper_path'):
                  raise SystemExit(f'paper_path already changed; refuse overwrite: {job_id}: {job.get("paper_path")}')
              job['paper_path'] = paper_path
              job_file.write_text(json.dumps(job, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(json.dumps({'backfilled_count': len(mapping), 'jobs': sorted(mapping)}, indent=2))
          PY

      - name: Re-scan completed jobs and dry-run identity reconciliation
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import patch

          jobs_root = Path('.survey/work-queue/jobs')
          missing = []
          target_paths = set()
          for p in sorted(jobs_root.glob('*.json')):
              job = json.loads(p.read_text(encoding='utf-8'))
              if job.get('status') == 'completed' and job.get('type') in {'research', 'audit'}:
                  if not job.get('paper_path'):
                      missing.append(job.get('job_id'))
                  if job.get('job_id') in {
                      'job-research-1587413c3d872e20','job-research-175c317515b75ca5','job-research-176f6ec6b8273a5c','job-research-569c68f713c406a9','job-research-5b8bc3f2f1ab32c5','job-research-5f3928ac49560aeb','job-research-651c768da8e5f9fc','job-research-67fd071bb1792a36','job-research-821890bf5e9d5e8e','job-research-a190f4e7421fc3f8','job-research-a297f1776b1a8b16','job-research-bb4463d4f717f17c','job-research-c17cf648935fd5ee','job-research-c7635853ef551bb8','job-research-cf1831adcf0d875d','job-research-ee6da232bd76e206','job-research-eeddee746504f3dd','job-research-f3407b821f3f7dcf','job-research-f9f62bef5889e903','job-research-fcb9e0b363722b52'
                  }:
                      target_paths.add(job['paper_path'])
          if missing:
              raise SystemExit(f'completed research/audit jobs still missing paper_path: {missing}')

          sys.path.insert(0, str(Path('.survey/scripts').resolve()))
          import queue_worker
          seen = []
          def fake_run(args, **kwargs):
              if isinstance(args, (list, tuple)) and 'identity_delta.py' in ' '.join(map(str, args)) and '--paper' in args:
                  seen.append(args[args.index('--paper') + 1])
              return SimpleNamespace(returncode=0, stdout='', stderr='')

          with patch('subprocess.run', side_effect=fake_run):
              queue_worker.reconcile_v9_identity_deltas()
          unseen = sorted(target_paths - set(seen))
          if unseen:
              raise SystemExit(f'backfilled papers not recognized by reconcile_v9_identity_deltas: {unseen}')
          print(json.dumps({'missing_completed_jobs': 0, 'backfilled_paths_seen_by_reconcile': len(target_paths)}, indent=2))
          PY

      - name: Compile survey scripts
        run: python -m compileall -q .survey/scripts

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(path)
          PY

      - name: Run all regression tests
        run: python -m unittest discover -s .survey/tests -p 'test_*.py'

      - name: Verify and commit only the audited job metadata changes
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '.survey/work-queue/jobs/job-research-1587413c3d872e20.json',
              '.survey/work-queue/jobs/job-research-175c317515b75ca5.json',
              '.survey/work-queue/jobs/job-research-176f6ec6b8273a5c.json',
              '.survey/work-queue/jobs/job-research-569c68f713c406a9.json',
              '.survey/work-queue/jobs/job-research-5b8bc3f2f1ab32c5.json',
              '.survey/work-queue/jobs/job-research-5f3928ac49560aeb.json',
              '.survey/work-queue/jobs/job-research-651c768da8e5f9fc.json',
              '.survey/work-queue/jobs/job-research-67fd071bb1792a36.json',
              '.survey/work-queue/jobs/job-research-821890bf5e9d5e8e.json',
              '.survey/work-queue/jobs/job-research-a190f4e7421fc3f8.json',
              '.survey/work-queue/jobs/job-research-a297f1776b1a8b16.json',
              '.survey/work-queue/jobs/job-research-bb4463d4f717f17c.json',
              '.survey/work-queue/jobs/job-research-c17cf648935fd5ee.json',
              '.survey/work-queue/jobs/job-research-c7635853ef551bb8.json',
              '.survey/work-queue/jobs/job-research-cf1831adcf0d875d.json',
              '.survey/work-queue/jobs/job-research-ee6da232bd76e206.json',
              '.survey/work-queue/jobs/job-research-eeddee746504f3dd.json',
              '.survey/work-queue/jobs/job-research-f3407b821f3f7dcf.json',
              '.survey/work-queue/jobs/job-research-f9f62bef5889e903.json',
              '.survey/work-queue/jobs/job-research-fcb9e0b363722b52.json',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected working tree diff: expected={sorted(expected)} actual={sorted(changed)}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .survey/work-queue/jobs
          git commit -m 'chore: backfill completed job paper paths'
          git push origin HEAD:cleanup/backfill-completed-job-paper-paths-20260913
