name: Library import kick

on:
  push:
    branches: [main]
    paths:
      - '.survey/scheduler/library-import-kick.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: library-import-kick-main
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Library import processor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/library-import.yml/dispatches" \
            -f ref=main
