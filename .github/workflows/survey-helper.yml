name: Survey helper worker

on:
  push:
    paths:
      - '.survey/work-queue/submissions/*.json'
      - '.survey/work-queue/transport/offline-job-seed.json'
      - '.survey/work-queue/transport/request-jobs.json'
      - '.survey/work-queue/fallback-inbox/*.json'
  workflow_dispatch:
  schedule:
    - cron: '3/10 * * * *'

permissions:
  contents: write

concurrency:
  group: survey-helper-main
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset reusable Chat inbox result when inbox changed
        if: github.event_name == 'push'
        run: |
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq '.survey/work-queue/submissions/chat-inbox.json'; then
            rm -f .survey/work-queue/results/chat-inbox.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot worker state for run ledger
        run: |
          python .survey/scripts/record_run_ledger.py snapshot \
            --repo-root . \
            --snapshot /tmp/survey-helper-baseline.json

      - name: Reconcile maintenance state from newer durable reports
        run: python .survey/scripts/reconcile_maintenance_state.py --repo-root .

      - name: Validate fallback worker syntax
        run: |
          python -m py_compile \
            .survey/scripts/fallback_transport.py \
            .survey/scripts/dispatch_fallback_inbox.py \
            .survey/scripts/preflight_chat_record.py \
            .survey/scripts/reconcile_maintenance_state.py \
            .survey/scripts/record_run_ledger.py \
            .survey/scripts/blocked_retry.py

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Dispatch one eligible fallback envelope
        run: python .survey/scripts/dispatch_fallback_inbox.py --repo-root . | tee /tmp/fallback-dispatch.json

      - name: Reconcile reusable Chat result with current inbox
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          inbox_path = Path('.survey/work-queue/submissions/chat-inbox.json')
          result_path = Path('.survey/work-queue/results/chat-inbox.json')
          if not inbox_path.exists():
              result_path.unlink(missing_ok=True)
              raise SystemExit(0)
          try:
              inbox = json.loads(inbox_path.read_text(encoding='utf-8'))
          except Exception:
              result_path.unlink(missing_ok=True)
              raise SystemExit(0)

          result = None
          if result_path.exists():
              try:
                  result = json.loads(result_path.read_text(encoding='utf-8'))
              except Exception:
                  result_path.unlink(missing_ok=True)

          job_id = inbox.get('job_id')
          if result and result.get('job_id') == job_id:
              print('Reusable Chat result matches current inbox.')
              raise SystemExit(0)

          paper = inbox.get('paper_path')
          job_path = Path('.survey/work-queue/jobs') / f'{job_id}.json' if job_id else None
          job = None
          if job_path and job_path.exists():
              try:
                  job = json.loads(job_path.read_text(encoding='utf-8'))
              except Exception:
                  job = None
          if (
              isinstance(paper, str)
              and paper.startswith('papers/')
              and Path(paper).is_file()
              and job
              and job.get('status') == 'completed'
          ):
              result_path.parent.mkdir(parents=True, exist_ok=True)
              result_path.write_text(
                  json.dumps({
                      'schema_version': 1,
                      'workflow_version': 9,
                      'submission': 'work-queue/submissions/chat-inbox.json',
                      'ok': True,
                      'job_id': job_id,
                      'job_type': job.get('type'),
                      'artifact': {'paper': paper},
                      'job_status': 'completed',
                      'reconciled': True,
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print('Reconciled terminal reusable Chat inbox from its existing canonical paper.')
          else:
              result_path.unlink(missing_ok=True)
              print('Removed stale reusable Chat result; current inbox still needs processing.')
          PY

      - name: Preflight current reusable Chat transport
        run: |
          if [ -f .survey/work-queue/results/chat-inbox.json ]; then
            echo 'Current reusable Chat inbox is already settled; preflight skipped.'
          else
            python .survey/scripts/preflight_chat_record.py \
              --repo-root . \
              --report /tmp/chat-preflight.json \
              --isolate-invalid
          fi

      - name: Prepare current reusable Chat transport when pending
        run: |
          if [ -f .survey/work-queue/results/chat-inbox.json ]; then
            echo 'Current reusable Chat inbox is settled or isolated; worker continues.'
          else
            python .survey/scripts/assemble_research_record.py --repo-root .
          fi

      - name: Process fallback-dispatched framework and LLM update
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          result = json.loads(Path('/tmp/fallback-dispatch.json').read_text(encoding='utf-8'))
          changed = set(result.get('changed_paths') or [])
          if '.survey/update-worker/update-inbox.json' not in changed:
              print('No framework/LLM update was dispatched in this run.')
              raise SystemExit(0)
          subprocess.run(
              [sys.executable, '.survey/scripts/update_worker.py', '--root', '.survey'],
              check=True,
          )
          PY

      - name: Materialize offline spillover jobs
        run: python .survey/scripts/apply_offline_job_seed.py --root .survey

      - name: Apply checkpoint-aware job requests
        run: python .survey/scripts/apply_transport_requests.py --root .survey

      - name: Suppress stale duplicate research jobs
        run: python .survey/scripts/dedupe_queue.py --root .survey

      - name: Normalize ready jobs to v10 contract
        run: python .survey/scripts/normalize_v10_jobs.py --root .survey

      - name: Process queue
        run: python .survey/scripts/queue_worker.py --root .survey

      - name: Suppress duplicates created by discovery and refresh queue
        run: |
          python .survey/scripts/dedupe_queue.py --root .survey
          python .survey/scripts/normalize_v10_jobs.py --root .survey
          python .survey/scripts/queue_worker.py --root .survey

      - name: Apply blocked research retry policy and refresh queue
        run: |
          python .survey/scripts/blocked_retry.py --root .survey
          python .survey/scripts/queue_worker.py --root .survey

      - name: Refresh citation graph when paper content changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- papers)" ]; then
            echo 'No paper changes in this worker run; citation refresh skipped.'
            exit 0
          fi

          echo 'Paper content changed; refreshing structured references and citation-derived indexes.'
          python .survey/scripts/backfill_citations.py \
            --root . \
            --limit 50 \
            --delay 0.25 \
            --apply \
            --retry-blocked
          python .survey/scripts/backfill_citation_pdfs.py \
            --root . \
            --limit 50 \
            --delay 0.25 \
            --apply \
            --retry-blocked
          python .survey/scripts/recover_blocked_citations.py \
            --root . \
            --limit 50 \
            --apply
          python .survey/scripts/citation_graph.py \
            --root . \
            --graph-report .survey/reports/citation-graph-latest.json \
            --coverage-report .survey/reports/citation-coverage-latest.json
          python .survey/scripts/survey.py --root .survey build

      - name: Record meaningful worker changes in run ledger
        run: |
          python .survey/scripts/record_run_ledger.py record \
            --repo-root . \
            --snapshot /tmp/survey-helper-baseline.json

      - name: Restore transient transport files
        run: |
          git checkout -- .survey/work-queue/payloads/chat-payload.md
          git checkout -- .survey/work-queue/submissions/chat-inbox.json

      - name: Commit queue results
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No queue changes to commit.'
            exit 0
          fi
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'survey-helper: process queue'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying after refetch."
            sleep $((attempt * 2))
          done
          echo 'Failed to push queue results after 5 non-fast-forward recovery attempts.' >&2
          exit 1
