name: Survey helper worker

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/submissions/*.json'
      - '.survey/work-queue/transport/offline-job-seed.json'
      - '.survey/work-queue/transport/request-jobs.json'
      - '.survey/work-queue/fallback-inbox/*.json'
  workflow_dispatch:
  schedule:
    - cron: '3/10 * * * *'

permissions:
  contents: write

# Background queue/index work is serialized without blocking claim or immutable
# submission fast lanes.
concurrency:
  group: survey-background-main
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot worker state for run ledger
        run: |
          python .survey/scripts/record_run_ledger.py snapshot \
            --repo-root . \
            --snapshot /tmp/survey-helper-baseline.json

      - name: Reconcile maintenance state from newer durable reports
        run: python .survey/scripts/reconcile_maintenance_state.py --repo-root .

      - name: Validate background helper syntax
        run: |
          python -m py_compile \
            .survey/scripts/fallback_transport.py \
            .survey/scripts/replay_record_fallback.py \
            .survey/scripts/dispatch_fallback_inbox.py \
            .survey/scripts/drain_fallback_recovery.py \
            .survey/scripts/process_immutable_submission_batch.py \
            .survey/scripts/reconcile_maintenance_state.py \
            .survey/scripts/record_run_ledger.py \
            .survey/scripts/normalize_required_metadata.py \
            .survey/scripts/normalize_research_paper_paths.py \
            .survey/scripts/refresh_queue_snapshot.py \
            .survey/scripts/queue_worker.py \
            .survey/scripts/blocked_retry.py

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Drain replayable Research and Audit fallbacks to publication
        run: |
          python .survey/scripts/drain_fallback_recovery.py \
            --repo-root . \
            --max-records 200 \
            --parallelism 4 | tee /tmp/fallback-recovery.json

      - name: Dispatch one eligible ordinary fallback envelope
        run: python .survey/scripts/dispatch_fallback_inbox.py --repo-root . --max-items 1 | tee /tmp/fallback-dispatch.json

      - name: Process fallback-dispatched framework and LLM update
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          result = json.loads(Path('/tmp/fallback-dispatch.json').read_text(encoding='utf-8'))
          changed = set(result.get('changed_paths') or [])
          if '.survey/update-worker/update-inbox.json' not in changed:
              print('No framework/LLM update was dispatched in this run.')
              raise SystemExit(0)
          subprocess.run(
              [sys.executable, '.survey/scripts/update_worker.py', '--root', '.survey'],
              check=True,
          )
          PY

      - name: Materialize offline spillover jobs
        run: python .survey/scripts/apply_offline_job_seed.py --root .survey

      - name: Apply checkpoint-aware job requests
        run: python .survey/scripts/apply_transport_requests.py --root .survey

      - name: Suppress stale duplicate research jobs
        run: python .survey/scripts/dedupe_queue.py --root .survey

      - name: Process queue and compatibility submissions
        run: python .survey/scripts/queue_worker.py --root .survey

      - name: Suppress duplicates created by discovery and refresh queue
        run: |
          python .survey/scripts/dedupe_queue.py --root .survey
          python .survey/scripts/queue_worker.py --root .survey

      - name: Apply blocked research retry policy and refresh queue
        run: |
          python .survey/scripts/blocked_retry.py --root .survey
          python .survey/scripts/queue_worker.py --root .survey

      - name: Normalize Research paper paths
        run: python .survey/scripts/normalize_research_paper_paths.py --repo-root . --apply

      - name: Normalize nullable required paper metadata
        run: python .survey/scripts/normalize_required_metadata.py --repo-root . --apply

      - name: Refresh citation graph when paper content changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- papers)" ]; then
            echo 'No paper changes in this worker run; citation refresh skipped.'
            exit 0
          fi

          echo 'Paper content changed; refreshing structured references and citation-derived indexes.'
          python .survey/scripts/backfill_citations.py \
            --root . \
            --limit 50 \
            --delay 0.25 \
            --apply \
            --retry-blocked
          python .survey/scripts/backfill_citation_pdfs.py \
            --root . \
            --limit 50 \
            --delay 0.25 \
            --apply \
            --retry-blocked
          python .survey/scripts/recover_blocked_citations.py \
            --root . \
            --limit 50 \
            --apply
          python .survey/scripts/citation_graph.py \
            --root . \
            --graph-report .survey/reports/citation-graph-latest.json \
            --coverage-report .survey/reports/citation-coverage-latest.json
          python .survey/scripts/survey.py --root .survey build

      - name: Record meaningful worker changes in run ledger
        run: |
          python .survey/scripts/record_run_ledger.py record \
            --repo-root . \
            --snapshot /tmp/survey-helper-baseline.json

      - name: Commit background queue results
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_SNAPSHOT='.survey/work-queue/next-jobs.json'

          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git fetch origin main

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
              echo 'No queue changes or local recovery commits to publish.'
              exit 0
            fi
            echo 'Worktree is clean, but local fallback pin commits still need publication.'
          else
            git add -A
            git commit -m 'survey-helper: process background queue'
          fi

          recover_derived_snapshot_conflict() {
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]:-}" != "$DERIVED_SNAPSHOT" ]; then
              echo 'Rebase conflict touches durable/non-derived state; refusing automatic resolution.' >&2
              printf 'Unmerged paths: %s\n' "${conflicts[*]:-none}" >&2
              if git rev-parse --verify -q REBASE_HEAD >/dev/null; then
                git rebase --abort || true
              fi
              return 1
            fi

            echo "Resolving derived snapshot conflict in ${DERIVED_SNAPSHOT} from latest main."
            git checkout --ours -- "$DERIVED_SNAPSHOT"
            git add "$DERIVED_SNAPSHOT"
            if git diff --cached --quiet; then
              git rebase --skip
            else
              GIT_EDITOR=true git rebase --continue
            fi
          }

          refresh_derived_snapshot() {
            python .survey/scripts/refresh_queue_snapshot.py --repo-root .
            if git diff --quiet -- "$DERIVED_SNAPSHOT"; then
              return 0
            fi

            git add "$DERIVED_SNAPSHOT"
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              git commit -m 'survey-helper: refresh derived queue snapshot after rebase'
            else
              git commit --amend --no-edit
            fi
          }

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              recover_derived_snapshot_conflict || exit 1
            fi
            refresh_derived_snapshot
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying after refetch."
            sleep $((attempt * 2))
          done
          echo 'Failed to push background queue results after 5 non-fast-forward recovery attempts.' >&2
          exit 1
