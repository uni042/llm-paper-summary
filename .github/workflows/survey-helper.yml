name: Survey helper worker

on:
  push:
    paths:
      - '.survey/requests/*.json'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: survey-helper-main
  cancel-in-progress: false

jobs:
  worker:
    if: github.event_name != 'issues' || (github.actor == github.repository_owner && startsWith(github.event.issue.title, '[survey-helper]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install helper dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Materialize issue request
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = (os.environ.get("ISSUE_BODY") or "").strip()
          req = json.loads(body)
          if not isinstance(req, dict):
              raise SystemExit("issue body must be one JSON object")
          path = Path(".survey/requests") / f"issue-{os.environ['ISSUE_NUMBER']}.json"
          if path.exists():
              raise SystemExit(f"request already exists: {path}")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(req, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(path)
          PY

      - name: Process issue request
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .survey/scripts/action_worker.py --request ".survey/requests/issue-${ISSUE_NUMBER}.json"

      - name: Process pending file requests
        if: github.event_name != 'issues'
        run: python .survey/scripts/action_worker.py

      - name: Commit worker results
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git add .survey/requests .survey/results .survey/survey-state papers
          git commit -m 'survey-helper: process requests'
          git push
