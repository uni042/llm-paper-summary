name: Survey helper worker

on:
  push:
    paths:
      - '.survey/work-queue/submissions/*.json'
      - '.survey/work-queue/transport/offline-job-seed.json'
      - '.survey/work-queue/transport/request-jobs.json'
      - '.survey/work-queue/fallback-inbox/*.json'
  workflow_dispatch:
  schedule:
    - cron: '3/10 * * * *'

permissions:
  contents: write

concurrency:
  group: survey-helper-main
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset reusable Chat inbox result when inbox changed
        if: github.event_name == 'push'
        run: |
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq '.survey/work-queue/submissions/chat-inbox.json'; then
            rm -f .survey/work-queue/results/chat-inbox.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Dispatch one eligible fallback envelope
        run: python .survey/scripts/dispatch_fallback_inbox.py --repo-root .

      - name: Materialize offline spillover jobs
        run: python .survey/scripts/apply_offline_job_seed.py --root .survey

      - name: Apply checkpoint-aware job requests
        run: python .survey/scripts/apply_transport_requests.py --root .survey

      - name: Prepare reusable Chat transport when pending
        run: |
          if [ -f .survey/work-queue/results/chat-inbox.json ]; then
            echo 'Reusable Chat inbox already has a result; skip transport assembly.'
          else
            python .survey/scripts/assemble_research_record_v10.py --repo-root .
            python .survey/scripts/assemble_chat_chunks.py --repo-root .
          fi

      - name: Suppress stale duplicate research jobs
        run: python .survey/scripts/dedupe_queue.py --root .survey

      - name: Normalize ready jobs to v10 contract
        run: python .survey/scripts/normalize_v10_jobs.py --root .survey

      - name: Process queue
        run: python .survey/scripts/queue_worker.py --root .survey

      - name: Suppress duplicates created by discovery and refresh queue
        run: |
          python .survey/scripts/dedupe_queue.py --root .survey
          python .survey/scripts/normalize_v10_jobs.py --root .survey
          python .survey/scripts/queue_worker.py --root .survey

      - name: Restore transient transport files
        run: |
          git checkout -- .survey/work-queue/payloads/chat-payload.md
          git checkout -- .survey/work-queue/submissions/chat-inbox.json

      - name: Commit queue results
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No queue changes to commit.'
            exit 0
          fi
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'survey-helper: process queue'
          git pull --rebase origin main
          git push origin HEAD:main
