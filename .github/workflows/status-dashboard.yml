name: Survey status dashboard

on:
  pull_request:
    paths:
      - '.survey/work-queue/**'
      - '.survey/scripts/build_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard_core.py'
      - '.survey/scripts/reference_pool.py'
      - '.survey/scripts/build_worker_worklist.py'
      - '.survey/tests/test_status*.py'
      - '.github/workflows/status-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'papers/**/*.md'
      - '.survey/scripts/build_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard_core.py'
      - '.survey/scripts/reference_pool.py'
      - '.survey/scripts/build_worker_worklist.py'
      - '.survey/tests/test_status*.py'
      - '.github/workflows/status-dashboard.yml'
  # Queue-only pushes stay decoupled so STATUS publication does not amplify the
  # hot queue lanes. Paper existence is itself direct STATUS evidence, so a
  # paper-only repair must refresh immediately instead of waiting for cron.
  # If the authoritative paper commit already carried STATUS.md, publish exits
  # without adding a second dashboard commit.
  schedule:
    - cron: '7/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-status-dashboard-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Direct-evidence dashboard regression tests
        run: python -m unittest discover -s .survey/tests -p 'test_status*.py'
      - name: Render dashboard in check mode
        run: python .survey/scripts/render_status_dashboard.py --output /tmp/STATUS.md
      - name: Render dedicated worker worklists in check mode
        run: python .survey/scripts/build_worker_worklist.py --repo-root . --output-dir /tmp/survey-worklists

  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Refresh STATUS.md from direct durable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Fxq 'STATUS.md'; then
              echo 'Triggering paper push already included STATUS.md; dashboard refresh is already atomic.'
              exit 0
            fi
          fi

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python .survey/scripts/render_status_dashboard.py --repo-root . --output STATUS.md
            python .survey/scripts/build_worker_worklist.py --repo-root .
            git add -A STATUS.md .survey/work-queue/WORKLIST-00.md .survey/work-queue/WORKLIST-30.md .survey/work-queue/worker-worklist-00.json .survey/work-queue/worker-worklist-30.json .survey/work-queue/WORKLIST.md .survey/work-queue/worker-worklist.json
            if git diff --cached --quiet; then
              echo 'Dashboard already current.'
              exit 0
            fi
            git commit -m 'chore: refresh survey status dashboard'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict on attempt ${attempt}; regenerating from latest main."
            sleep $((attempt * 2))
          done
          echo 'Failed to publish STATUS.md after retries.' >&2
          exit 1
