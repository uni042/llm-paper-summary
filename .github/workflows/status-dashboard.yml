name: Survey status dashboard

on:
  pull_request:
    paths:
      - '.survey/work-queue/**'
      - '.survey/scripts/build_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard_core.py'
      - '.survey/repair-queue/under-16kb-reaudit.json'
      - '.survey/scripts/reference_pool.py'
      - '.survey/scripts/candidate_priority.py'
      - '.survey/config/candidate-priority.json'
      - '.survey/work-queue/candidate-priority-cache.json'
      - '.survey/work-queue/forward-citation-sweep.json'
      - '.survey/scripts/build_worker_worklist.py'
      - '.survey/scripts/discovery_relevance_prefilter.py'
      - '.survey/scripts/forward_lineage_citation.py'
      - '.survey/config/discovery-relevance-prefilter.json'
      - '.survey/scripts/refresh_queue_snapshot.py'
      - '.survey/scripts/research_job_reconciliation.py'
      - '.survey/scripts/reconcile_represented_research_jobs.py'
      - '.survey/tests/test_research_job_reconciliation.py'
      - '.survey/tests/test_status*.py'
      - '.github/workflows/status-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'papers/**/*.md'
      - '.survey/work-queue/maintenance-cycle.json'
      # Durable Research states and relevance decisions must refresh worklists.
      - '.survey/work-queue/jobs/**'
      - '.survey/work-queue/reference-curation/borderline-papers.json'
      - '.survey/work-queue/reference-curation/unrelated-papers.json'
      - '.survey/scripts/build_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard.py'
      - '.survey/scripts/render_status_dashboard_core.py'
      - '.survey/repair-queue/under-16kb-reaudit.json'
      - '.survey/scripts/reference_pool.py'
      - '.survey/scripts/candidate_priority.py'
      - '.survey/config/candidate-priority.json'
      - '.survey/work-queue/candidate-priority-cache.json'
      - '.survey/work-queue/forward-citation-sweep.json'
      - '.survey/scripts/build_worker_worklist.py'
      - '.survey/scripts/discovery_relevance_prefilter.py'
      - '.survey/scripts/forward_lineage_citation.py'
      - '.survey/config/discovery-relevance-prefilter.json'
      - '.survey/scripts/refresh_queue_snapshot.py'
      - '.survey/scripts/research_job_reconciliation.py'
      - '.survey/scripts/reconcile_represented_research_jobs.py'
      - '.survey/tests/test_research_job_reconciliation.py'
      - '.survey/tests/test_status*.py'
      - '.github/workflows/status-dashboard.yml'
  # Hot work-queue ingress stays decoupled. A semantic re-audit queue refresh
  # directly changes the top-line remaining count and must republish STATUS.
  # Paper-only repair also refreshes without waiting for cron.
  # Never treat an updated STATUS.md as proof that the worker worklists are current.
  # Regeneration is idempotent: unchanged worklists keep their generated_at.
  # The schedule is a backstop for missed push events, not the primary trigger.
  schedule:
    - cron: '17 * * * *'
  # GitHub Actions commits made with GITHUB_TOKEN don't start a new push workflow.
  # Workflow completion events do, so refresh from the latest main after intake.
  workflow_run:
    workflows:
      - Library import processor
      - Library Discovery fast intake
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-status-dashboard-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Direct-evidence dashboard regression tests
        run: python -m unittest discover -s .survey/tests -p 'test_status*.py'
      - name: Paper/job reconciliation regression tests
        run: python -m unittest discover -s .survey/tests -p 'test_research_job_reconciliation.py'
      - name: Render dashboard in check mode
        run: python .survey/scripts/render_status_dashboard.py --output /tmp/STATUS.md
      - name: Render dedicated worker worklists in check mode
        run: python .survey/scripts/build_worker_worklist.py --repo-root . --output-dir /tmp/survey-worklists

  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Refresh STATUS.md from direct durable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python .survey/scripts/reconcile_represented_research_jobs.py --repo-root .
            python .survey/scripts/refresh_queue_snapshot.py --repo-root . >/tmp/next-jobs.json
            python .survey/scripts/render_status_dashboard.py --repo-root . --output STATUS.md
            python .survey/scripts/build_worker_worklist.py --repo-root .
            git add -A STATUS.md .survey/work-queue/jobs .survey/work-queue/next-jobs.json .survey/work-queue/WORKLIST-00.md .survey/work-queue/WORKLIST-30.md .survey/work-queue/WORKLIST-45.md .survey/work-queue/worker-worklist-00.json .survey/work-queue/worker-worklist-30.json .survey/work-queue/worker-worklist-45.json
            if git diff --cached --quiet; then
              echo 'Dashboard already current.'
              exit 0
            fi
            git commit -m 'chore: refresh survey status dashboard'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict on attempt ${attempt}; rebasing generated snapshot onto latest main."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Published rebased dashboard snapshot without discarding the completed regeneration."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Rebase publish did not win the race; regenerating from latest main."
            sleep $((attempt * 2))
          done
          echo 'Failed to publish STATUS.md after retries.' >&2
          exit 1
