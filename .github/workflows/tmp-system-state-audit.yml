name: Temporary survey state audit

on:
  push:
    branches:
      - cleanup/state-semantics-and-fast-triggers
    paths:
      - '.github/workflows/tmp-system-state-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/state-semantics-and-fast-triggers
          fetch-depth: 0

      - name: Build read-only state report
        run: |
          python - <<'PY'
          import json
          import sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / '.survey/scripts'))
          import claim_state
          import immutable_submission
          import select_record_bank

          def read(path):
              try:
                  value = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return None
              return value

          now = datetime.now(timezone.utc)
          jobs = []
          for path in sorted((root / '.survey/work-queue/jobs').glob('*.json')):
              value = read(path)
              if isinstance(value, dict):
                  jobs.append(value)
          job_counts = Counter((str(j.get('type')), str(j.get('status'))) for j in jobs)

          claims_raw = []
          for path in sorted((root / '.survey/work-queue/claims').glob('*.json')):
              value = read(path)
              if isinstance(value, dict):
                  value = dict(value)
                  value['_file'] = path.name
                  claims_raw.append(value)
          current = claim_state.current_claims(root, now)
          active = []
          for job_id, value in sorted(current.items()):
              if not value.get('active'):
                  continue
              raw = next((r for r in claims_raw if str(r.get('job_id') or Path(r['_file']).stem) == job_id), {})
              active.append({key: raw.get(key) for key in (
                  'job_id','claim_id','request_id','attempt_id','worker_id','worker_kind','kind',
                  'claimed_at','heartbeat_at','expires_at','released_at','lease_invalidated_at',
                  'record_bank','record_bank_reserved_at','record_bank_fallback','record_bank_migration',
                  'checkpoint_ref','library_checkpoint','checkpointed_at'
              ) if key in raw})

          claim_counts = {
              'total_files': len(claims_raw),
              'active_by_expiry': sum(1 for v in current.values() if v.get('active')),
              'expired_by_expiry': sum(1 for v in current.values() if v.get('expired')),
              'released_marker': sum(1 for v in claims_raw if v.get('released_at')),
              'invalidated_marker': sum(1 for v in claims_raw if v.get('lease_invalidated_at')),
              'record_bank': sum(1 for v in claims_raw if v.get('record_bank')),
              'record_bank_fallback': sum(1 for v in claims_raw if v.get('record_bank_fallback')),
              'record_bank_migration': sum(1 for v in claims_raw if v.get('record_bank_migration')),
              'checkpoint_marker': sum(1 for v in claims_raw if v.get('checkpoint_ref') or v.get('library_checkpoint') or v.get('checkpointed_at')),
          }

          requests = list((root / '.survey/work-queue/claim-requests').glob('*.json'))
          results = root / '.survey/work-queue/claim-results'
          unprocessed_requests = sorted(p.stem for p in requests if not (results / p.name).exists())

          pending = []
          for descriptor in immutable_submission.pending_descriptors(root):
              rel = descriptor.get('_path')
              dpath = root / rel if rel else None
              rpath = immutable_submission.result_path_for(root, dpath) if dpath else None
              result = read(rpath) if rpath else None
              pending.append({
                  'path': rel,
                  'job_id': descriptor.get('job_id'),
                  'attempt_id': descriptor.get('attempt_id'),
                  'kind': descriptor.get('kind'),
                  'record_bank': descriptor.get('record_bank'),
                  'result_exists': bool(result),
                  'result_ok': result.get('ok') if isinstance(result, dict) else None,
                  'result_error': result.get('error') if isinstance(result, dict) else None,
              })

          legacy_paths = [
              '.survey/work-queue/submissions/chat-inbox.json',
              '.survey/work-queue/results/chat-inbox.json',
              '.survey/work-queue/submissions/chat-audit-inbox.json',
              '.survey/work-queue/results/chat-audit-inbox.json',
              '.survey/work-queue/transport/offline-job-seed.json',
          ]
          report = {
              'generated_at': now.isoformat(),
              'head': __import__('subprocess').check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'jobs': {f'{k[0]}:{k[1]}': v for k, v in sorted(job_counts.items())},
              'claims': claim_counts,
              'active_claims': active,
              'unprocessed_claim_requests': unprocessed_requests,
              'pending_immutable_descriptors': pending,
              'record_banks': select_record_bank.inspect(root),
              'legacy_path_presence': {p: (root / p).exists() for p in legacy_paths},
          }
          (root / '.survey/tmp-system-state-audit.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          {
            echo '# Legacy / duplicated-state references';
            git grep -n -E 'chat-inbox|legacy|rollout|record_bank_migration|record_bank_fallback|28800|8[- ]?hour|8時間|fallback-inbox|lease_invalidated_at|released_at' -- .survey .github/workflows || true;
          } > .survey/tmp-legacy-references.txt

      - name: Commit diagnostic report to audit branch only
        run: |
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add .survey/tmp-system-state-audit.json .survey/tmp-legacy-references.txt
          git commit -m 'chore: capture temporary survey state audit'
          git push origin HEAD:cleanup/state-semantics-and-fast-triggers
