name: Survey research quality preflight

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/research-preflight/requests/*.json'
      - '.survey/scripts/research_quality_preflight.py'
      - '.survey/scripts/paper_quality_gate.py'
      - '.survey/scripts/prepare_completed_submission.py'
      - '.survey/scripts/advance_research_submission_pipeline.py'
      - '.github/workflows/survey-research-quality-preflight.yml'
  workflow_dispatch:
    inputs:
      request:
        description: 'Repository-relative Research/Audit quality preflight request path'
        required: false
        type: string
  schedule:
    - cron: '8/10 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: survey-completed-materialization-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Process unsettled quality preflight requests
        shell: bash
        env:
          MANUAL_REQUEST: ${{ inputs.request }}
        run: |
          set -euo pipefail
          git config user.name 'survey-research-preflight[bot]'
          git config user.email 'survey-research-preflight[bot]@users.noreply.github.com'
          mkdir -p .survey/work-queue/research-preflight/requests .survey/work-queue/research-preflight/results

          published=0
          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main

            mapfile -t requests < <(
              find .survey/work-queue/research-preflight/requests -maxdepth 1 -type f -name '*.json' 2>/dev/null | sort
            )
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${MANUAL_REQUEST:-}" ]; then
              requests=("$MANUAL_REQUEST")
            fi

            processed=0
            for request in "${requests[@]:-}"; do
              [ -n "$request" ] || continue
              case "$request" in
                .survey/work-queue/research-preflight/requests/*.json) ;;
                *) echo "Unsupported quality preflight request path: $request" >&2; exit 2 ;;
              esac
              name="$(basename "$request")"
              result=".survey/work-queue/research-preflight/results/$name"
              if [ -f "$result" ]; then
                continue
              fi
              python .survey/scripts/research_quality_preflight.py \
                --repo-root . \
                --request "$request" \
                --result "$result"
              processed=$((processed + 1))
            done

            if [ "$processed" -eq 0 ]; then
              echo 'No unsettled Research/Audit quality preflight requests remain.'
              published=1
              break
            fi

            git add .survey/work-queue/research-preflight/results
            git commit -m 'survey: publish research quality preflight results'
            if git push origin HEAD:main; then
              published=1
              break
            fi

            echo "Quality preflight push race on attempt ${attempt}; recomputing from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            jitter=$(( RANDOM % 6 ))
            sleep $((backoff + jitter))
          done

          if [ "$published" -ne 1 ]; then
            echo 'Failed to publish Research/Audit quality preflight results after retries.' >&2
            exit 1
          fi

      - name: Auto-materialize passing preflights
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'survey-research-preflight[bot]'
          git config user.email 'survey-research-preflight[bot]@users.noreply.github.com'

          published=0
          built=0
          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p \
              .survey/work-queue/completed-submission-requests \
              .survey/work-queue/completed-submission-failures \
              .survey/work-queue/submissions/research \
              .survey/work-queue/submissions/audit
            python .survey/scripts/advance_research_submission_pipeline.py \
              --repo-root . \
              --mode all \
              --manifest /tmp/research-pipeline.json
            built="$(jq -r '.built_descriptors | length' /tmp/research-pipeline.json)"
            jq -r '.built_descriptors[]?' /tmp/research-pipeline.json > /tmp/new-descriptors.txt
            python .survey/scripts/update_worker_run_index.py \
              --repo-root . \
              --descriptors-file /tmp/new-descriptors.txt \
              --manifest /tmp/run-index-descriptors.json
            python .survey/scripts/compact_worker_hot_queue.py \
              --repo-root . \
              --apply \
              --preflight-result-retention-hours 2

            git add -A \
              .survey/work-queue/completed-submission-requests \
              .survey/work-queue/completed-submission-failures \
              .survey/work-queue/research-preflight \
              .survey/work-queue/run-state/cache \
              .survey/work-queue/submissions/research \
              .survey/work-queue/submissions/audit

            if git diff --cached --quiet; then
              echo 'No new completed descriptors or isolation records to publish.'
              published=1
              break
            fi

            git commit -m 'survey-submission: auto-materialize passed preflights'
            if git push origin HEAD:main; then
              published=1
              break
            fi

            echo "Research pipeline push race on attempt ${attempt}; recomputing from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            jitter=$(( RANDOM % 6 ))
            sleep $((backoff + jitter))
          done

          if [ "$published" -ne 1 ]; then
            echo 'Failed to publish auto-materialized descriptors after retries.' >&2
            exit 1
          fi

          # GITHUB_TOKEN pushes do not recursively trigger push workflows.
          # One dispatch is enough: the submission lane drains every unsettled descriptor.
          if [ "$built" -gt 0 ]; then
            gh workflow run survey-submission-fast.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
          fi
