name: Survey reference relevance fast lane

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/reference-curation/requests/*.json'
  workflow_dispatch:
  schedule:
    - cron: '7/10 * * * *'

permissions:
  contents: write

concurrency:
  group: survey-reference-relevance-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Apply pending relevance requests and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-reference-relevance[bot]'
          git config user.email 'survey-reference-relevance[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main

            set +e
            python .survey/scripts/process_reference_relevance_requests.py --repo-root . \
              | tee /tmp/reference-relevance-summary.json
            processor_status=${PIPESTATUS[0]}
            set -e

            git add \
              .survey/work-queue/reference-curation/unrelated-papers.json \
              .survey/work-queue/reference-curation/borderline-papers.json \
              .survey/work-queue/reference-curation/results

            if ! git diff --cached --quiet; then
              git commit -m 'survey: apply reference relevance requests'
              if git push origin HEAD:main; then
                if [ "${processor_status}" -ne 0 ]; then
                  echo 'Published successful sibling requests; retryable requests remain pending.' >&2
                  exit "${processor_status}"
                fi
                exit 0
              fi
              echo "Push race on attempt ${attempt}; rebuilding from latest main." >&2
              continue
            fi

            if [ "${processor_status}" -eq 0 ]; then
              echo 'No pending reference relevance changes.'
              exit 0
            fi

            echo "Retryable relevance processing error on attempt ${attempt}; retrying from latest main." >&2
          done

          echo 'Reference relevance fast lane did not converge after 6 attempts.' >&2
          exit 1
