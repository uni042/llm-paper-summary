name: Temporary shared immutable result semantics refactor

on:
  push:
    branches:
      - fix/immutable-failure-pending-semantics
    paths:
      - '.github/workflows/tmp-refactor-immutable-result-semantics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/immutable-failure-pending-semantics

      - name: Centralize immutable result predicates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.survey/scripts/immutable_submission.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _result_matches(path: Path, descriptor: dict[str, Any]) -> bool:\n    result = _read_object(path)\n    return bool(\n        result\n        and result.get("ok") is True\n        and result.get("attempt_id") == descriptor.get("attempt_id")\n        and result.get("job_id") == descriptor.get("job_id")\n    )\n'''
          new = '''def result_matches_identity(result: Any, descriptor: dict[str, Any]) -> bool:\n    """Return whether a result belongs to the descriptor's exact attempt/job."""\n    return bool(\n        isinstance(result, dict)\n        and result.get("attempt_id") == descriptor.get("attempt_id")\n        and result.get("job_id") == descriptor.get("job_id")\n    )\n\n\ndef result_is_success_for(result: Any, descriptor: dict[str, Any]) -> bool:\n    """Return whether the exact descriptor has a successful terminal processor result."""\n    return result_matches_identity(result, descriptor) and result.get("ok") is True\n\n\ndef _result_matches(path: Path, descriptor: dict[str, Any]) -> bool:\n    return result_is_success_for(_read_object(path), descriptor)\n'''
          if text.count(old) != 1:
              raise SystemExit('immutable_submission target did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('.survey/scripts/claim_worker.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'import claim_state\n'
          new_import = 'import claim_state\nimport immutable_submission\n'
          if text.count(old_import) != 1:
              raise SystemExit('claim_worker import target did not match exactly once')
          text = text.replace(old_import, new_import, 1)
          old = '''            if (\n                isinstance(result, dict)\n                and result.get("job_id") == job_id\n                and result.get("attempt_id") == attempt_id\n                and result.get("ok") is True\n            ):\n                continue\n'''
          new = '''            if immutable_submission.result_is_success_for(result, value):\n                continue\n'''
          if text.count(old) != 1:
              raise SystemExit('claim_worker result target did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('.survey/scripts/process_immutable_submission.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if (\n        result.get("attempt_id") == descriptor.get("attempt_id")\n        and result.get("job_id") == descriptor.get("job_id")\n    ):\n        return result if result.get("ok") is True else None\n'''
          new = '''    if immutable_submission.result_matches_identity(result, descriptor):\n        return result if immutable_submission.result_is_success_for(result, descriptor) else None\n'''
          if text.count(old) != 1:
              raise SystemExit('processor matching-result target did not match exactly once')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    """Persist a terminal attempt result so invalid descriptors do not occupy a bank forever."""\n',
              '    """Persist retryable processor failure history for this exact immutable attempt."""\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch diff
        run: |
          git diff --check
          git diff -- .survey/scripts/immutable_submission.py .survey/scripts/claim_worker.py .survey/scripts/process_immutable_submission.py

      - name: Commit refactor
        run: |
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add .survey/scripts/immutable_submission.py .survey/scripts/claim_worker.py .survey/scripts/process_immutable_submission.py
          git commit -m 'refactor: centralize immutable result semantics'
          git push origin HEAD:fix/immutable-failure-pending-semantics
