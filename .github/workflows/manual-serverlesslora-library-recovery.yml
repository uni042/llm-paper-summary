name: Manual ServerlessLoRA Library recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-serverlesslora-library-recovery.yml'
      - '.survey/work-queue/manual-recovery/serverlesslora/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-serverlesslora-library-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and stage exact rekeyed Library payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path

          q = Path('.survey/work-queue')
          stage = q / 'manual-recovery/serverlesslora'
          meta = json.loads((stage / 'meta.json').read_text(encoding='utf-8'))
          if not (
              meta.get('schema_version') == 1
              and meta.get('encoding') == 'base64'
              and meta.get('compression') == 'xz'
          ):
              raise SystemExit('invalid recovery metadata contract')

          parts = sorted(stage.glob('part-*.txt'))
          if len(parts) != meta.get('parts'):
              raise SystemExit('recovery part count mismatch')
          expected_names = [f'part-{i:02d}.txt' for i in range(meta['parts'])]
          if [p.name for p in parts] != expected_names:
              raise SystemExit('recovery part sequence mismatch')
          for i, path in enumerate(parts):
              want = meta['last_part_size'] if i == len(parts) - 1 else meta['full_part_size']
              if path.stat().st_size != want:
                  raise SystemExit(f'recovery part size mismatch: {path.name}')

          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          if len(encoded) != meta.get('encoded_length'):
              raise SystemExit('encoded length mismatch')
          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != meta.get('compressed_size'):
              raise SystemExit('compressed size mismatch')
          if hashlib.sha256(compressed).hexdigest() != meta.get('compressed_sha256'):
              raise SystemExit('compressed sha256 mismatch')

          raw = lzma.decompress(compressed)
          if len(raw) != meta.get('payload_size'):
              raise SystemExit('payload size mismatch')
          if hashlib.sha256(raw).hexdigest() != meta.get('payload_sha256'):
              raise SystemExit('payload sha256 mismatch')
          envelope = json.loads(raw)
          if envelope.get('id') != meta.get('recovery_envelope_id'):
              raise SystemExit('recovery envelope id mismatch')
          if envelope.get('job_id') != meta.get('job_id'):
              raise SystemExit('job id mismatch')
          if envelope.get('attempt_id') != meta.get('attempt_id'):
              raise SystemExit('attempt id mismatch')

          provenance = envelope.get('recovery_provenance') or {}
          if provenance.get('source_envelope_id') != meta.get('source_envelope_id'):
              raise SystemExit('source envelope provenance mismatch')
          if provenance.get('source_sha256') != meta.get('source_sha256'):
              raise SystemExit('source sha provenance mismatch')

          writes = envelope.get('writes')
          if not isinstance(writes, list) or len(writes) != meta.get('writes') or len(writes) != 6:
              raise SystemExit('complete six-write payload required')
          expected_slots = {
              '.survey/work-queue/records/chat-record/metadata.json': 'metadata',
              '.survey/work-queue/records/chat-record/problem_method.json': 'problem_method',
              '.survey/work-queue/records/chat-record/evaluation.json': 'evaluation',
              '.survey/work-queue/records/chat-record/results.json': 'results',
              '.survey/work-queue/records/chat-record/positioning.json': 'positioning',
          }
          seen = set()
          legacy_count = 0
          for write in writes:
              path = write.get('path') if isinstance(write, dict) else None
              content = write.get('content') if isinstance(write, dict) else None
              if not isinstance(path, str) or not isinstance(content, str):
                  raise SystemExit('invalid write entry')
              if path in expected_slots:
                  payload = json.loads(content)
                  if payload.get('transport_version') != 10:
                      raise SystemExit(f'invalid transport version: {path}')
                  if payload.get('slot') != expected_slots[path]:
                      raise SystemExit(f'slot mismatch: {path}')
                  if payload.get('job_id') != meta['job_id'] or payload.get('attempt_id') != meta['attempt_id']:
                      raise SystemExit(f'job/attempt mismatch: {path}')
                  seen.add(path)
              elif path == '.survey/work-queue/submissions/chat-inbox.json':
                  legacy = json.loads(content)
                  if legacy.get('job_id') != meta['job_id'] or legacy.get('attempt_id') != meta['attempt_id']:
                      raise SystemExit('legacy descriptor identity mismatch')
                  legacy_count += 1
              else:
                  raise SystemExit(f'unexpected recovery write path: {path}')
          if seen != set(expected_slots) or legacy_count != 1:
              raise SystemExit('recovery payload does not contain exactly five slots plus one legacy descriptor')

          # The conflicting GitHub same-id payload is deliberately preserved as evidence.
          bad = q / 'fallback-failed' / f"{meta['source_envelope_id']}.json"
          old = json.loads(bad.read_text(encoding='utf-8'))
          if old.get('id') != meta['source_envelope_id'] or old.get('writes') != []:
              raise SystemExit('expected empty-writes conflict placeholder is not present exactly as observed')

          dest = q / 'fallback-inbox' / f"{meta['recovery_envelope_id']}.json"
          dest.parent.mkdir(parents=True, exist_ok=True)
          if dest.exists():
              if dest.read_bytes() != raw:
                  raise SystemExit('recovery inbox destination conflict')
          else:
              dest.write_bytes(raw)

          report = {
              'schema_version': 1,
              'status': 'staged_to_fallback_inbox',
              'source_envelope_id': meta['source_envelope_id'],
              'recovery_envelope_id': meta['recovery_envelope_id'],
              'payload_sha256': meta['payload_sha256'],
              'source_sha256': meta['source_sha256'],
              'destination': dest.as_posix(),
              'preserved_conflicting_placeholder': bad.as_posix(),
          }
          (stage / 'report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit exact recovery payload to fallback inbox
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git add \
            .survey/work-queue/fallback-inbox/20260913T200500JST-serverlesslora-attempt-257f6eb558ebdd1e9a226b04-library-recovery-v1.json \
            .survey/work-queue/manual-recovery/serverlesslora/report.json
          if git diff --cached --quiet; then
            echo 'ServerlessLoRA recovery payload already staged exactly.'
            exit 0
          fi
          git commit -m 'survey: stage exact ServerlessLoRA Library recovery payload'
          git pull --rebase origin main
          git push origin HEAD:main
