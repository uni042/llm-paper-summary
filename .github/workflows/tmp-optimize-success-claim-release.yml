name: Temporary optimize successful claim release

on:
  push:
    branches: [fix/repair-claim-record-recovery-20260913-run]
    paths:
      - '.github/workflows/tmp-optimize-success-claim-release.yml'

permissions:
  contents: write

jobs:
  optimize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-claim-record-recovery-20260913-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt
      - name: Limit successful-result lookup to current claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.survey/scripts/claim_worker.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _successful_immutable_attempts(root: Path) -> set[tuple[str, str]]:\n    """Return exact job/attempt pairs whose immutable processor result is successful."""\n    successful: set[tuple[str, str]] = set()\n    submissions = root / ".survey/work-queue/submissions"\n    results = root / ".survey/work-queue/results"\n    for kind in sorted(JOB_TYPES):\n        folder = submissions / kind\n        for path in sorted(folder.glob("*.json")) if folder.is_dir() else []:\n            descriptor = _read(path)\n            if not isinstance(descriptor, dict):\n                continue\n            job_id = descriptor.get("job_id")\n            attempt_id = descriptor.get("attempt_id")\n            if not isinstance(job_id, str) or not SAFE_ID_RE.fullmatch(job_id):\n                continue\n            if not isinstance(attempt_id, str) or not SAFE_ID_RE.fullmatch(attempt_id):\n                continue\n            result = _read(results / kind / path.name)\n            if immutable_submission.result_is_success_for(result, descriptor):\n                successful.add((job_id, attempt_id))\n    return successful\n'''
          new = '''def _successful_immutable_attempts(\n    root: Path,\n    claims: dict[str, dict[str, Any]],\n) -> set[tuple[str, str]]:\n    """Return successful immutable attempts only for current claim identities."""\n    successful: set[tuple[str, str]] = set()\n    submissions = root / ".survey/work-queue/submissions"\n    results = root / ".survey/work-queue/results"\n    for job_id, claim in claims.items():\n        attempt_id = claim.get("attempt_id")\n        kind = claim.get("kind")\n        if kind not in JOB_TYPES:\n            continue\n        if not isinstance(job_id, str) or not SAFE_ID_RE.fullmatch(job_id):\n            continue\n        if not isinstance(attempt_id, str) or not SAFE_ID_RE.fullmatch(attempt_id):\n            continue\n        folder = submissions / kind\n        for path in sorted(folder.glob(f"{attempt_id}*.json")) if folder.is_dir() else []:\n            descriptor = _read(path)\n            if not isinstance(descriptor, dict):\n                continue\n            if descriptor.get("job_id") != job_id or descriptor.get("attempt_id") != attempt_id:\n                continue\n            result = _read(results / kind / path.name)\n            if immutable_submission.result_is_success_for(result, descriptor):\n                successful.add((job_id, attempt_id))\n                break\n    return successful\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one success helper, found {text.count(old)}')
          text = text.replace(old, new)
          old_call = '    durable_attempts |= _successful_immutable_attempts(root)\n'
          new_call = '    durable_attempts |= _successful_immutable_attempts(root, claims)\n'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one success helper call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused and full suites
        run: |
          python -m unittest discover -s .survey/tests -p 'test_claim_checkpoint_barrier.py'
          python -m compileall -q .survey/scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          python -m unittest discover -s .survey/tests -p 'test_*.py'
      - name: Commit optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .survey/scripts/claim_worker.py
          git diff --cached --check
          git commit -m 'perf: limit successful claim release lookup to active identities'
          git push origin HEAD:fix/repair-claim-record-recovery-20260913-run
