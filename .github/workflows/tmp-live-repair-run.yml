name: Temporary live repair pipeline run

on:
  push:
    branches: [fix/repair-claim-record-recovery-20260913-run]
    paths:
      - '.github/workflows/tmp-live-repair-run.yml'

permissions:
  contents: write

concurrency:
  group: tmp-live-repair-run
  cancel-in-progress: false

jobs:
  live-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/repair-claim-record-recovery-20260913-run

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Repair and process SpectrumKV from recovered immutable slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / '.survey/scripts'))
          import assemble_research_record as assemble
          import claim_worker_with_banks
          import immutable_submission
          import process_immutable_submission
          from record_bank_config import BANK_ROOTS, SLOT_NAMES

          def read(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          job_id = 'job-research-ec01b6de422e6692'
          old_attempt = 'attempt-d0e5054b6a381715aab8671d'
          old_submission = f'.survey/work-queue/submissions/research/{old_attempt}.json'
          old_result_path = root / f'.survey/work-queue/results/research/{old_attempt}.json'
          historical_failure = {
              'schema_version': 1,
              'workflow_version': 10,
              'ok': False,
              'attempt_id': old_attempt,
              'job_id': job_id,
              'job_type': 'research',
              'job_status': None,
              'artifact': None,
              'submission': old_submission,
              'error': 'ValueError: problem_method.method_overview must explain the end-to-end mechanism',
              'processed_at': '2026-09-13T08:51:43+00:00',
          }
          if old_result_path.exists():
              assert read(old_result_path) == historical_failure
          else:
              write(old_result_path, historical_failure)

          job_path = root / '.survey/work-queue/jobs' / f'{job_id}.json'
          job = read(job_path)
          assert job.get('status') == 'ready', job
          original_priority = job.get('priority')
          job['priority'] = 100000
          write(job_path, job)

          now = dt.datetime.now(dt.timezone.utc)
          request_id = 'manual-repair-spectrum-final-20260913'
          write(root / '.survey/work-queue/claim-requests' / f'{request_id}.json', {
              'schema_version': 1,
              'request_id': request_id,
              'worker_id': 'manual-repair-spectrum-final',
              'worker_kind': 'work',
              'requested_at': now.isoformat(),
              'max_jobs': 1,
              'lease_seconds': 5400,
              'job_types': ['research'],
          })
          claim_metrics = claim_worker_with_banks.process_requests(root, at=now)
          claim_result = read(root / '.survey/work-queue/claim-results' / f'{request_id}.json')
          assignments = claim_result.get('assignments') or []
          assert len(assignments) == 1, claim_result
          assignment = assignments[0]
          assert assignment['job_id'] == job_id, assignment
          assert assignment.get('record_bank_recovery') == 'repair-required-immutable-descriptor', assignment
          assert assignment.get('record_bank_recovery_attempt_ids') == [old_attempt], assignment

          job = read(job_path)
          job['priority'] = original_priority
          write(job_path, job)

          bank = assignment['record_bank']
          pm_path = root / BANK_ROOTS[bank] / 'problem_method.json'
          pm = read(pm_path)
          repair_log = []

          before = assemble.prose_chars(pm['data']['method_overview'])
          if before < 500:
              pm['data']['method_overview'] += (
                  'エンドツーエンドでは、プリフィルGPUで通常のFP16 KVを生成し、重要度を計算し、'
                  '転送予算に沿ってトークンごとにFP16・INT8・INT4を選択して量子化する。次に量子化KVと'
                  'トークン別の精度地図をネットワーク越しにデコードGPUへ送り、受信側は地図に従って各KVを復号し、'
                  '低重要度位置も削除せず全トークンを通常の注意計算へ入力する。配備前の試験でINT4不適合と判定された'
                  'モデルでは精度集合をFP16・INT8へ縮退させ、同じ予算制約の下で割当を再計算する。'
                  'したがって転送量削減、復号、生成までが一つの流れとして完結し、削除方式のような欠落位置の再取得を必要としない。'
              )
              repair_log.append({'field': 'method_overview', 'before': before, 'after': assemble.prose_chars(pm['data']['method_overview'])})

          additions = [
              'この単調割当は、同じ転送予算で重要位置の量子化誤差を抑えつつ、低重要度位置も低精度表現として残すための中核である。削除型と違って全位置に情報を保持するので、検索対象が事前に特定できない長文でも完全な情報消失を避けられる。',
              'この保護と順位付けを組み合わせることで、位置だけで決める固定比率ではなく、モデルが実際に参照しやすい場所へ高精度の転送量を重点配分できる。注意統計が取得できない場合も代替指標へ切り替え、同じ精度割当の枠組みを維持する。',
              'この配備時試験は量子化方式を一律に固定せず、モデルごとの注意分布の鋭さを実測結果で判定する安全弁として働く。INT4で検索能力が崩れるモデルは自動的に2段階へ戻すため、帯域削減率より品質維持を優先できる。',
              'この近似保持は将来の高精度化にも使え、必要な位置だけを低精度表現から更新できる。現論文では完全な階層取得機構までは実装していないものの、削除後にFP16全量を取り直す設計より追加帯域を小さくできる方向を示している。',
          ]
          for index, component in enumerate(pm['data']['components']):
              before_len = assemble.prose_chars(component.get('description'))
              if before_len < 240:
                  component['description'] = str(component.get('description') or '') + additions[index]
                  repair_log.append({'field': f'components[{index}].description', 'before': before_len, 'after': assemble.prose_chars(component['description'])})

          write(pm_path, pm)

          record = {}
          for slot in SLOT_NAMES:
              payload = read(root / BANK_ROOTS[bank] / f'{slot}.json')
              assert payload.get('attempt_id') == assignment['attempt_id']
              assert payload.get('job_id') == job_id
              record[slot] = payload['data']
          normalized = assemble.normalize_preferred_terms(record)
          assemble.ensure_explanatory_summary(normalized)
          assemble.validate_record(normalized)
          prose = assemble.record_prose_text(normalized)
          ratio, jp_chars, latin_chars = assemble.japanese_ratio(prose)

          refs = []
          for slot in SLOT_NAMES:
              path = f"{BANK_ROOTS[bank]}/{slot}.json"
              raw = (root / path).read_bytes()
              refs.append({'slot': slot, 'path': path, 'blob_sha': immutable_submission.git_blob_sha(raw)})
          descriptor = {
              'schema_version': 1,
              'transport_version': 10,
              'kind': 'research',
              'status': 'completed',
              'attempt_id': assignment['attempt_id'],
              'job_id': job_id,
              'claim_id': assignment['claim_id'],
              'worker_id': assignment['worker_id'],
              'worker_kind': assignment['worker_kind'],
              'record_bank': bank,
              'paper_path': job['paper_path'],
              'record_slots': refs,
          }
          submission_path = root / '.survey/work-queue/submissions/research' / f"{assignment['attempt_id']}.json"
          write(submission_path, descriptor)
          result = process_immutable_submission.process(root, submission_path)
          assert result.get('ok') is True, result
          final_job = read(job_path)
          assert final_job.get('status') == 'completed', final_job
          assert not final_job.get('repair_required'), final_job
          paper = root / job['paper_path']
          assert paper.is_file()

          report = {
              'job_id': job_id,
              'old_attempt': old_attempt,
              'new_attempt': assignment['attempt_id'],
              'bank': bank,
              'recovery': assignment.get('record_bank_recovery'),
              'repairs': repair_log,
              'language_ratio': round(ratio, 4),
              'japanese_chars': jp_chars,
              'latin_chars': latin_chars,
              'result_ok': result.get('ok'),
              'paper_path': job['paper_path'],
              'paper_bytes': paper.stat().st_size,
              'claim_metrics': claim_metrics,
          }
          write(root / '.survey/reports/live-spectrum-repair-2026-09-13.json', report)
          print('SPECTRUM_REPAIR_JSON=' + json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verify repository tests after real processing
        run: |
          python -m compileall -q .survey/scripts
          python -m unittest discover -s .survey/tests -p 'test_*.py'

      - name: Commit real processing results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .survey/work-queue .survey/reports/live-spectrum-repair-2026-09-13.json papers
          git status --short
          if git diff --cached --quiet; then
            echo 'No processing changes to commit'
            exit 1
          fi
          git commit -m 'test: process SpectrumKV repair from recovered records'
          git push origin HEAD:fix/repair-claim-record-recovery-20260913-run
