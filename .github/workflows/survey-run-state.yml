name: Survey worker run-state derivation

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/run-state/requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-run-state-main
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derive run state
        run: python .survey/scripts/derive_worker_run_state.py --repo-root .

      - name: Commit run-state results
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'Run-state requests already settled.'
            exit 0
          fi
          git config user.name 'survey-run-state[bot]'
          git config user.email 'survey-run-state[bot]@users.noreply.github.com'
          git add .survey/work-queue/run-state/results
          git commit -m 'survey-run-state: derive worker continuation state'
          git pull --rebase origin main
          git push origin HEAD:main
