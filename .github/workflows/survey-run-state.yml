name: Survey worker run-state derivation

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/run-state/requests/*.json'
      - '.survey/scripts/derive_worker_run_state.py'
      - '.survey/scripts/worker_run_state_cache.py'
  workflow_dispatch:
  schedule:
    - cron: '4/10 * * * *'

permissions:
  contents: write

# Initial Research/Audit claims are allocated in this workflow. Share the same
# serialization domain as the standalone claim lane so queue ownership remains atomic.
concurrency:
  group: survey-claim-main
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derive state and allocate an eligible initial claim in one lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-run-state[bot]'
          git config user.email 'survey-run-state[bot]@users.noreply.github.com'

          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main

            python .survey/scripts/derive_worker_run_state.py --repo-root .

            {
              git diff --name-only -- .survey/work-queue/run-state/results
              git ls-files --others --exclude-standard -- .survey/work-queue/run-state/results
            } \
              | grep '^.survey/work-queue/run-state/results/.*\.json$' \
              | sort -u \
              > /tmp/changed-run-state-results.txt || true

            if [ -s /tmp/changed-run-state-results.txt ]; then
              python .survey/scripts/auto_claim_from_run_state.py \
                --repo-root . \
                --run-state-results-file /tmp/changed-run-state-results.txt
            fi

            python .survey/scripts/compact_worker_transport.py \
              --repo-root . \
              --apply \
              --min-age-seconds 7200 \
              --report /tmp/transport-compact.json \
              || echo 'Transport compaction failed; run-state publication continues and maintenance will retry.'

            git add -A \
              .survey/work-queue/run-state \
              .survey/work-queue/archive \
              .survey/work-queue/claim-requests \
              .survey/work-queue/claim-results \
              .survey/work-queue/claims \
              .survey/work-queue/jobs \
              .survey/work-queue/records \
              .survey/work-queue/completed-submission-requests \
              .survey/work-queue/research-preflight

            if git diff --cached --quiet; then
              echo 'Run-state requests already settled.'
              exit 0
            fi

            git commit -m 'survey-run-state: derive state and allocate initial claim'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Run-state push race on attempt ${attempt}; recomputing unsettled requests from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            jitter=$(( RANDOM % 6 ))
            sleep $((backoff + jitter))
          done

          echo 'Failed to publish run-state results after 12 retries; periodic recovery will retry unsettled requests.' >&2
          exit 1
