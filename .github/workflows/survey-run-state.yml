name: Survey worker run-state derivation

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/run-state/requests/*.json'
  workflow_dispatch:
  schedule:
    - cron: '4/10 * * * *'

permissions:
  contents: write

concurrency:
  group: survey-run-state-main
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derive and publish run-state results with race recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-run-state[bot]'
          git config user.email 'survey-run-state[bot]@users.noreply.github.com'

          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main

            python .survey/scripts/derive_worker_run_state.py --repo-root .
            git add .survey/work-queue/run-state/results

            if git diff --cached --quiet; then
              echo 'Run-state requests already settled.'
              exit 0
            fi

            git commit -m 'survey-run-state: derive worker continuation state'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Run-state push race on attempt ${attempt}; recomputing unsettled requests from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            jitter=$(( RANDOM % 6 ))
            sleep $((backoff + jitter))
          done

          echo 'Failed to publish run-state results after 12 retries; periodic recovery will retry unsettled requests.' >&2
          exit 1
