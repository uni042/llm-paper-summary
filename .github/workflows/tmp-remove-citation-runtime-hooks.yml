name: Temporary stage citation workflow mirror

on:
  push:
    branches:
      - cleanup/canonical-state-and-legacy
    paths:
      - '.github/workflows/tmp-remove-citation-runtime-hooks.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/canonical-state-and-legacy
          fetch-depth: 0
      - name: Generate cleaned workflow mirror
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/citation-graph-backfill.yml')
          text = src.read_text(encoding='utf-8')
          start = text.index('      - name: Install citation schema hooks\n')
          end = text.index('      - name: Validate citation implementation\n', start)
          text = text[:start] + text[end:]
          start = text.index('      - name: Commit schema and graph hooks\n')
          end = text.index('      - name: Backfill references in durable batches\n', start)
          text = text[:start] + text[end:]
          out = Path('.survey/tmp/citation-graph-backfill.yml.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding='utf-8')
          PY
          git diff --check -- .survey/tmp/citation-graph-backfill.yml.txt
      - name: Commit mirror only
        run: |
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add .survey/tmp/citation-graph-backfill.yml.txt
          git commit -m 'chore: stage cleaned citation workflow mirror'
          git push origin HEAD:cleanup/canonical-state-and-legacy
