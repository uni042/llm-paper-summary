name: Framework and LLM update worker

on:
  push:
    branches: [main]
    paths:
      - '.survey/update-worker/update-inbox.json'
  workflow_dispatch:

permissions:
  contents: write

# Keep framework/LLM updates in their own queue; cross-workflow shared concurrency
# can silently replace pending runs.
concurrency:
  group: framework-llm-update-main
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          # One tip commit; full main ancestry is restored without historical
          # blob bodies by the next step (same pattern as library-import).
          fetch-depth: 1

      - name: Restore main ancestry for publish rebases
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --unshallow --filter=blob:none --no-tags origin main
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo 'Update helper requires full main ancestry; refusing shallow history.' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process framework and LLM update
        run: python .survey/scripts/update_worker.py --root .survey

      - name: Commit update results
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No update changes to commit.'
            exit 0
          fi
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'survey-helper: apply framework and LLM updates'
          git pull --rebase origin main
          git push origin HEAD:main
