name: Citation graph backfill

on:
  push:
    branches: [main]
    paths:
      - 'papers/**/*.md'
      - '.github/workflows/citation-graph-backfill.yml'
      - '.survey/scripts/citation_graph.py'
      - '.survey/scripts/backfill_citations.py'
      - '.survey/scripts/backfill_citation_pdfs.py'
      - '.survey/scripts/recover_blocked_citations.py'
      - '.survey/scripts/normalize_paper_metadata.py'
      - '.survey/scripts/render_paper.py'
      - '.survey/scripts/assemble_research_record.py'
      - '.survey/tests/test_citation_graph.py'
      - '.survey/tests/test_pdf_citation_fallback.py'
      - '.survey/tests/test_recover_blocked_citations.py'
      - '.survey/tests/test_render_paper_metadata.py'
  workflow_dispatch:

permissions:
  contents: write

# Citation backfill is heavyweight background state. Serialize it with the
# background helper/maintenance lane without blocking claim/submission fast lanes.
concurrency:
  group: survey-background-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Validate citation implementation
        run: |
          python -m py_compile \
            .survey/scripts/citation_graph.py \
            .survey/scripts/backfill_citations.py \
            .survey/scripts/backfill_citation_pdfs.py \
            .survey/scripts/recover_blocked_citations.py \
            .survey/scripts/normalize_paper_metadata.py \
            .survey/scripts/render_paper.py \
            .survey/scripts/assemble_research_record.py \
            .survey/scripts/survey.py
          python -m unittest discover -s .survey/tests -p 'test_*.py'

      - name: Backfill references in durable batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .survey/reports
          for round in $(seq 1 20); do
            published=0
            result=''
            for publish_attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              echo "citation backfill batch ${round}, publish attempt ${publish_attempt}"
              result=$(python .survey/scripts/backfill_citations.py --root . --limit 25 --delay 0.75 --apply)
              echo "$result"
              python .survey/scripts/citation_graph.py \
                --root . \
                --graph-report .survey/reports/citation-graph-latest.json \
                --coverage-report .survey/reports/citation-coverage-latest.json
              python .survey/scripts/survey.py --root .survey build

              git add README.md papers .survey/reports/citation-backfill-state.json \
                .survey/reports/citation-coverage-latest.json \
                .survey/reports/citation-graph-latest.json \
                .survey/survey-state/paper-identity-index.json
              if git diff --cached --quiet; then
                published=1
                break
              fi

              git commit -m "data: backfill citation references batch ${round}"
              if git push origin HEAD:main; then
                published=1
                break
              fi

              echo "Citation push race on attempt ${publish_attempt}; recomputing citation batch from latest main."
              sleep $((publish_attempt * 2))
            done

            if [ "$published" != '1' ]; then
              echo "Failed to publish citation batch ${round} after 5 recomputations." >&2
              exit 1
            fi

            attempted=$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["attempted"])' <<< "$result")
            if [ "$attempted" = "0" ]; then
              echo 'No unprocessed citation sources remain.'
              break
            fi
          done

      - name: Retry blocked references from primary PDFs
        run: |
          python .survey/scripts/backfill_citation_pdfs.py \
            --root . \
            --limit 50 \
            --delay 0.75 \
            --apply \
            --retry-blocked

      - name: Recover publisher and withdrawn-arXiv citation blockers
        run: |
          python .survey/scripts/recover_blocked_citations.py \
            --root . \
            --limit 50 \
            --apply

      - name: Rebuild final graph and indexes
        run: |
          python .survey/scripts/citation_graph.py \
            --root . \
            --graph-report .survey/reports/citation-graph-latest.json \
            --coverage-report .survey/reports/citation-coverage-latest.json
          python .survey/scripts/survey.py --root .survey build

      - name: Normalize nullable metadata defaults
        run: python .survey/scripts/normalize_paper_metadata.py --root . --apply

      - name: Audit citation coverage
        id: citations
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.survey/reports/citation-coverage-latest.json').read_text())
          incomplete = int(report['summary']['incomplete'])
          print(f'citation_incomplete={incomplete}')
          raise SystemExit(0 if incomplete == 0 else 1)
          PY
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit metadata coverage
        id: metadata
        shell: bash
        run: |
          set +e
          python .survey/scripts/audit_metadata_coverage.py \
            --repo-root . \
            --json-out .survey/reports/metadata-coverage-latest.json \
            --strict
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run regression tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s .survey/tests -p 'test_*.py'
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build repository inventory
        run: |
          python .survey/scripts/build_repository_inventory.py \
            --root . \
            --output /tmp/repo-inventory.json \
            --source-commit citation-backfill-working-tree

      - name: Repository-wide consistency check
        id: consistency
        shell: bash
        run: |
          set +e
          python .survey/scripts/check_repository.py \
            --root . \
            --inventory /tmp/repo-inventory.json \
            --report .survey/reports/consistency-latest.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final derived reports
        shell: bash
        run: |
          set -euo pipefail
          git add README.md papers .survey/reports .survey/survey-state/paper-identity-index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: finalize citation graph indexes and audits'
          for push_attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Final citation reports conflicted with newer main; a later citation trigger will recompute them.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Final citation push race on attempt ${push_attempt}; retrying after refetch."
            sleep $((push_attempt * 2))
          done
          echo 'Failed to publish final citation reports after 5 retries.' >&2
          exit 1

      - name: Fail if final validation found issues
        shell: bash
        run: |
          citation_rc='${{ steps.citations.outputs.exit_code }}'
          metadata_rc='${{ steps.metadata.outputs.exit_code }}'
          tests_rc='${{ steps.tests.outputs.exit_code }}'
          consistency_rc='${{ steps.consistency.outputs.exit_code }}'
          if [ "$citation_rc" != '0' ] || [ "$metadata_rc" != '0' ] || [ "$tests_rc" != '0' ] || [ "$consistency_rc" != '0' ]; then
            echo "Final validation failed: citations=$citation_rc metadata=$metadata_rc tests=$tests_rc consistency=$consistency_rc"
            exit 1
          fi
