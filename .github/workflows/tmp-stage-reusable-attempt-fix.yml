name: Temporary stage reusable attempt fix

on:
  push:
    branches:
      - cleanup/canonical-state-and-legacy
    paths:
      - '.github/workflows/tmp-stage-reusable-attempt-fix.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/canonical-state-and-legacy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch non-workflow implementation and stage workflow mirror
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement anchor, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              '.survey/scripts/select_record_bank.py',
              '''        result\n        and result.get("job_id") == inbox.get("job_id")\n        and result.get("ok") is True\n''',
              '''        result\n        and result.get("job_id") == inbox.get("job_id")\n        and result.get("attempt_id") == inbox.get("attempt_id")\n        and result.get("ok") is True\n''',
          )

          replace_once(
              '.survey/scripts/queue_worker.py',
              '''            sub = read_json(p, {})\n            sub["_file"] = str(p.relative_to(ROOT))\n''',
              '''            sub = read_json(p, {})\n            sub["_file"] = str(p.relative_to(ROOT))\n            attempt_id = sub.get("attempt_id")\n            if isinstance(attempt_id, str) and attempt_id:\n                result["attempt_id"] = attempt_id\n''',
          )

          docs = Path('.survey/docs/survey-workflow/queue-v10.md')
          text = docs.read_text(encoding='utf-8')
          anchor = '''- 期限切れ後にworkerがまだ成果をGitHub/Libraryへ耐久保存していない場合は旧claimで新規送信せず、fresh claimを取得し直す\n\nclaim result待ち中に別requestを重ねず、完全payloadの耐久保存後は新しいrequest IDで次jobを1件だけ取得する。\n'''
          addition = '''- claimがactiveなのは、`expires_at`が未来で、かつ`released_at`と`lease_invalidated_at`のどちらも存在しない場合だけ。claimファイルは監査履歴として残す。\n- immutable Research/Audit resultは、同じjob/attemptに対する`ok: true`だけを成功確定として扱う。`ok: false`はdescriptorを未解決のまま残し、再処理可能とする。\n- reusable `chat-inbox.json` resultも、同じjob/attemptに対する`ok: true`だけをsettledとして扱う。失敗resultやattempt不一致resultはpreflight前に再利用しない。\n- legacy root-level submissionを`queue_worker.py`で処理する経路は一回限りのprocessing receiptであり、対応resultが存在すれば同じroot submissionを再処理しない。Research/Auditのretryable transportにはimmutable descriptor fast laneを使う。\n\nclaim result待ち中に別requestを重ねず、完全payloadの耐久保存後は新しいrequest IDで次jobを1件だけ取得する。\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'queue-v10.md: expected claim anchor once, got {text.count(anchor)}')
          docs.write_text(text.replace(anchor, anchor.split('\n\nclaim result')[0] + '\n' + addition, 1), encoding='utf-8')

          src = Path('.github/workflows/survey-helper.yml')
          text = src.read_text(encoding='utf-8')
          old = '''          job_id = inbox.get('job_id')\n          if result and result.get('job_id') == job_id and result.get('ok') is True:\n              print('Reusable Chat result matches current inbox.')\n              raise SystemExit(0)\n'''
          new = '''          job_id = inbox.get('job_id')\n          attempt_id = inbox.get('attempt_id')\n          if (\n              result\n              and result.get('job_id') == job_id\n              and result.get('attempt_id') == attempt_id\n              and result.get('ok') is True\n          ):\n              print('Reusable Chat result matches current inbox job/attempt.')\n              raise SystemExit(0)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'survey-helper.yml: match anchor count {text.count(old)}')
          text = text.replace(old, new, 1)
          old2 = '''                      'ok': True,\n                      'job_id': job_id,\n                      'job_type': job.get('type'),\n'''
          new2 = '''                      'ok': True,\n                      'job_id': job_id,\n                      'attempt_id': attempt_id,\n                      'job_type': job.get('type'),\n'''
          if text.count(old2) != 1:
              raise SystemExit(f'survey-helper.yml: reconcile anchor count {text.count(old2)}')
          text = text.replace(old2, new2, 1)
          out = Path('.survey/tmp/survey-helper.yml.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m unittest discover -s .survey/tests -p 'test_claim_and_legacy_transport_state.py'
      - name: Commit non-workflow changes and mirror
        run: |
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add .survey/scripts/select_record_bank.py .survey/scripts/queue_worker.py .survey/docs/survey-workflow/queue-v10.md .survey/tmp/survey-helper.yml.txt
          git commit -m 'fix: bind reusable chat success to exact attempt'
          git push origin HEAD:cleanup/canonical-state-and-legacy
