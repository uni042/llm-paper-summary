name: Temporary stage paper path persistence fix

on:
  push:
    branches: [fix/persist-submission-paper-path-20260913]
    paths:
      - '.github/workflows/tmp-stage-paper-path-persistence.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-submission-paper-path-20260913
          fetch-depth: 0

      - name: Persist completion paper paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.survey/scripts/queue_worker.py')
          text = path.read_text(encoding='utf-8')

          research = '''        job["artifact_submission"] = sub.get("_file")\n        clear_repair_state(job)\n        st["stats"]["research_completed"] += 1\n'''
          research_new = '''        job["artifact_submission"] = sub.get("_file")\n        if sub.get("paper_path"):\n            job["paper_path"] = sub["paper_path"]\n        clear_repair_state(job)\n        st["stats"]["research_completed"] += 1\n'''
          if text.count(research) != 1:
              raise SystemExit(f'research anchor count={text.count(research)}')
          text = text.replace(research, research_new, 1)

          audit = '''        job["artifact_submission"] = sub.get("_file")\n        clear_repair_state(job)\n        st["stats"]["audit_completed"] += 1\n'''
          audit_new = '''        job["artifact_submission"] = sub.get("_file")\n        if sub.get("paper_path"):\n            job["paper_path"] = sub["paper_path"]\n        clear_repair_state(job)\n        st["stats"]["audit_completed"] += 1\n'''
          if text.count(audit) != 1:
              raise SystemExit(f'audit anchor count={text.count(audit)}')
          text = text.replace(audit, audit_new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression
        run: python -m unittest discover -s .survey/tests -p 'test_job_paper_path_persistence.py'

      - name: Commit implementation
        run: |
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add .survey/scripts/queue_worker.py
          git commit -m 'fix: persist submission paper path on completion'
          git push origin HEAD:fix/persist-submission-paper-path-20260913
