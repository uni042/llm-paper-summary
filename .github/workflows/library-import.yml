name: Library import processor

on:
  workflow_dispatch:
    inputs:
      drain_generation:
        description: 'Bounded self-drain generation; normally omitted'
        required: false
        default: '0'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/library-import.yml'
      - '.survey/scripts/process_library_import_inbox.py'
      - '.survey/tests/test_library_import_inbox.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: library-import-main
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.survey/scripts/requirements.txt'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Validate Library import code
        run: |
          python -m py_compile \
            .survey/scripts/process_library_import_inbox.py \
            .survey/scripts/process_discovery_precheck_batch.py \
            .survey/scripts/process_reference_relevance_requests.py \
            .survey/scripts/queue_worker.py \
            .survey/scripts/render_status_dashboard.py
          python -m unittest discover -s .survey/tests -p 'test_library_import_inbox.py'

      - name: Process bounded Library import work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-library-import[bot]'
          git config user.email 'survey-library-import[bot]@users.noreply.github.com'

          sync_main() {
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
          }

          publish() {
            local message="$1"
            shift
            git add -A -- "$@"
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "$message"
            git push origin HEAD:main
          }

          # Stage 1: intake is bounded by actual work volume, not file count.
          # Research: at most 5 papers. Discovery: at most 60 records.
          stage1_ok=0
          for attempt in $(seq 1 6); do
            sync_main
            python .survey/scripts/process_library_import_inbox.py \
              --repo-root . \
              --max-research 5 \
              --max-discovery-records 60
            python .survey/scripts/render_status_dashboard.py \
              --repo-root . \
              --output STATUS.md

            if publish \
              'library-import: checkpoint bounded intake' \
              .survey/import-inbox \
              .survey/work-queue/discovery-precheck \
              .survey/work-queue/reference-curation \
              .survey/work-queue/jobs \
              .survey/work-queue/next-jobs.json \
              .survey/work-queue/state.json \
              .survey/survey-state \
              papers \
              README.md \
              STATUS.md; then
              stage1_ok=1
              break
            fi
            echo "Library intake push race on attempt ${attempt}; recomputing from latest main."
          done
          [ "$stage1_ok" -eq 1 ] || {
            echo 'Library intake checkpoint failed.' >&2
            exit 1
          }

          # Stage 2: process only relevance work here. Discovery precheck
          # requests are published in Stage 1 and MUST be resolved by the
          # dedicated discovery-precheck.yml workflow so provenance validation
          # in queue_worker remains trustworthy. Commits made with GITHUB_TOKEN
          # do not chain-trigger another workflow via push, so explicitly
          # dispatch the dedicated gate when an unsettled request exists.
          sync_main
          if find .survey/work-queue/discovery-precheck/requests \
              -maxdepth 1 -type f -name 'libimp-*-pre*.json' -print 2>/dev/null \
              | while IFS= read -r request; do
                  result=".survey/work-queue/discovery-precheck/results/$(basename "$request")"
                  [ -f "$result" ] || { printf '%s\n' "$request"; break; }
                done \
              | grep -q .; then
            active_precheck_runs="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow discovery-precheck.yml \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length')"
            if [ "${active_precheck_runs:-0}" -eq 0 ]; then
              echo 'Dispatching dedicated Discovery precheck gate for Library import requests.'
              gh workflow run discovery-precheck.yml \
                --repo "${GITHUB_REPOSITORY}" \
                --ref main
            else
              echo "Discovery precheck gate already active (${active_precheck_runs} run(s)); skip duplicate dispatch."
            fi
          fi

          stage2_ok=0
          for attempt in $(seq 1 4); do
            sync_main

            set +e
            python .survey/scripts/process_reference_relevance_requests.py \
              --repo-root . \
              --max-requests 60
            relevance_rc=$?
            set -e

            if publish \
              'library-import: publish bounded relevance checks' \
              .survey/work-queue/reference-curation; then
              stage2_ok=1
              break
            fi
            echo "Library relevance-check push race on attempt ${attempt}; recomputing."
          done
          [ "$stage2_ok" -eq 1 ] || {
            echo 'Library relevance checkpoint failed.' >&2
            exit 1
          }

          # Stage 3: re-read current main and advance only the same <=60-record
          # Discovery window. Research is disabled after the intake stage.
          stage3_ok=0
          for attempt in $(seq 1 4); do
            sync_main
            python .survey/scripts/process_library_import_inbox.py \
              --repo-root . \
              --max-research 0 \
              --max-discovery-records 60

            if publish \
              'library-import: advance bounded Discovery work' \
              .survey/import-inbox \
              .survey/work-queue/submissions \
              .survey/work-queue/discovery-precheck \
              .survey/work-queue/reference-curation; then
              stage3_ok=1
              break
            fi
            echo "Library Discovery advance push race on attempt ${attempt}; recomputing."
          done
          [ "$stage3_ok" -eq 1 ] || {
            echo 'Library Discovery advance failed.' >&2
            exit 1
          }

          # Stage 4: a 60-record Discovery window creates at most twelve normal
          # five-candidate submissions. Keep extra historical queue work bounded.
          stage4_ok=0
          for attempt in $(seq 1 4); do
            sync_main
            python .survey/scripts/queue_worker.py \
              --root .survey \
              --max-submissions 16

            if publish \
              'library-import: process bounded submissions' \
              .survey/work-queue \
              .survey/survey-state \
              papers \
              README.md \
              STATUS.md; then
              stage4_ok=1
              break
            fi
            echo "Library submission push race on attempt ${attempt}; recomputing."
          done
          [ "$stage4_ok" -eq 1 ] || {
            echo 'Library submission processing failed.' >&2
            exit 1
          }

          # Stage 5: terminalize completed chunks and refresh STATUS.
          stage5_ok=0
          for attempt in $(seq 1 4); do
            sync_main
            python .survey/scripts/process_library_import_inbox.py \
              --repo-root . \
              --max-research 0 \
              --max-discovery-records 60
            python .survey/scripts/render_status_dashboard.py \
              --repo-root . \
              --output STATUS.md

            if publish \
              'library-import: settle bounded work and refresh STATUS' \
              .survey/import-inbox \
              .survey/work-queue \
              .survey/survey-state \
              papers \
              README.md \
              STATUS.md; then
              stage5_ok=1
              break
            fi
            echo "Library settle push race on attempt ${attempt}; recomputing."
          done
          [ "$stage5_ok" -eq 1 ] || {
            echo 'Library settle failed.' >&2
            exit 1
          }

          if [ "${relevance_rc:-0}" -ne 0 ]; then
            echo 'Some relevance requests remain retryable; durable progress was preserved.' >&2
          fi

          # Continue draining without relying on GitHub scheduled-event delivery.
          # Each run remains bounded and queues at most one successor.
          sync_main

          count_files() {
            local dir="$1"
            local pattern="$2"
            if [ ! -d "$dir" ]; then
              printf '0\n'
              return 0
            fi
            find "$dir" -maxdepth 1 -type f -name "$pattern" -print | wc -l
          }

          research_backlog=$(count_files .survey/import-inbox/pending/research '*.md')
          discovery_pending=$(count_files .survey/import-inbox/pending/discovery '*.json')
          discovery_waiting=$(count_files .survey/import-inbox/waiting/discovery '*.json')
          backlog_total=$((research_backlog + discovery_pending + discovery_waiting))

          # Only Library-owned libimp-* requests gate this importer; preload-*
          # requests belong to the independent Discovery preload lane.
          unsettled_library_prechecks="$(
            find .survey/work-queue/discovery-precheck/requests \
              -maxdepth 1 -type f -name 'libimp-*-pre*.json' -print 2>/dev/null \
              | while IFS= read -r request; do
                  result=".survey/work-queue/discovery-precheck/results/$(basename "$request")"
                  [ -f "$result" ] || printf '%s\n' "$request"
                done \
              | wc -l
          )"
          unsettled_library_prechecks="${unsettled_library_prechecks//[[:space:]]/}"

          generation="${{ github.event.inputs.drain_generation || '0' }}"
          if ! [[ "$generation" =~ ^[0-9]+$ ]]; then
            generation=0
          fi

          echo "Library backlog after this run: research=${research_backlog}, discovery_pending=${discovery_pending}, discovery_waiting=${discovery_waiting}, generation=${generation}"

          if [ "$backlog_total" -gt 0 ] && [ "${unsettled_library_prechecks:-0}" -gt 0 ]; then
            echo "Library backlog is waiting on ${unsettled_library_prechecks} dedicated Discovery precheck result(s); precheck completion will resume import."
          elif [ "$backlog_total" -gt 0 ] && [ "$generation" -lt 96 ]; then
            next_generation=$((generation + 1))
            echo "Queueing bounded Library import continuation generation ${next_generation}."
            GH_TOKEN="${{ github.token }}" gh workflow run library-import.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main \
              -f drain_generation="${next_generation}"
          elif [ "$backlog_total" -gt 0 ]; then
            echo "Backlog remains after generation cap; a later batch kick or central dispatch will resume it." >&2
          else
            echo 'Library import backlog is drained.'
          fi
