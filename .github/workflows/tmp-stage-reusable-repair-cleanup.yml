name: Temporary stage reusable repair cleanup

on:
  push:
    branches: [fix/reusable-repair-state-cleanup-20260913]
    paths:
      - '.github/workflows/tmp-stage-reusable-repair-cleanup.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reusable-repair-state-cleanup-20260913
          fetch-depth: 0

      - name: Apply reusable repair-state cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.survey/scripts/queue_worker.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''def update_job(job: dict):\n    p = job.pop("_path", JOBS / f"{job['job_id']}.json")\n    write_json(Path(p), job)\n\n\n'''
          helper = '''def update_job(job: dict):\n    p = job.pop("_path", JOBS / f"{job['job_id']}.json")\n    write_json(Path(p), job)\n\n\ndef clear_repair_state(job: dict):\n    """Clear stale validation-isolation metadata after successful completion."""\n    job.pop("repair_required", None)\n    job.pop("validation_error", None)\n    job.pop("last_validation_failed_at", None)\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'update_job anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          research = '''        job["artifact_submission"] = sub.get("_file")\n        st["stats"]["research_completed"] += 1\n'''
          research_new = '''        job["artifact_submission"] = sub.get("_file")\n        clear_repair_state(job)\n        st["stats"]["research_completed"] += 1\n'''
          if text.count(research) != 1:
              raise SystemExit(f'research anchor count={text.count(research)}')
          text = text.replace(research, research_new, 1)

          audit = '''        job["artifact_submission"] = sub.get("_file")\n        st["stats"]["audit_completed"] += 1\n'''
          audit_new = '''        job["artifact_submission"] = sub.get("_file")\n        clear_repair_state(job)\n        st["stats"]["audit_completed"] += 1\n'''
          if text.count(audit) != 1:
              raise SystemExit(f'audit anchor count={text.count(audit)}')
          text = text.replace(audit, audit_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression test
        run: python -m unittest discover -s .survey/tests -p 'test_repair_state_cleanup.py'

      - name: Commit implementation
        run: |
          git config user.name 'survey-maintenance[bot]'
          git config user.email 'survey-maintenance[bot]@users.noreply.github.com'
          git add .survey/scripts/queue_worker.py
          git commit -m 'fix: clear reusable repair state after success'
          git push origin HEAD:fix/reusable-repair-state-cleanup-20260913
