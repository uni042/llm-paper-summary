name: Survey claim fast lane

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/claim-requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-claim-main
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate claim fast-path syntax
        run: |
          python -m py_compile \
            .survey/scripts/claim_state.py \
            .survey/scripts/claim_worker.py \
            .survey/scripts/claim_worker_with_banks.py \
            .survey/scripts/apply_library_checkpoint_barriers.py \
            .survey/scripts/normalize_research_paper_paths.py \
            .survey/scripts/select_record_bank.py \
            .survey/scripts/record_bank_config.py \
            .survey/scripts/refresh_queue_snapshot.py \
            .survey/scripts/ensure_dashboard_history.py \
            .survey/scripts/build_status_dashboard.py \
            .survey/scripts/append_research_throughput_status.py \
            .survey/scripts/refine_status_observability.py

      - name: Allocate claims, reserve record banks, and publish lightweight snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-claim[bot]'
          git config user.email 'survey-claim[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python .survey/scripts/normalize_research_paper_paths.py --repo-root . --apply
            python .survey/scripts/apply_library_checkpoint_barriers.py --repo-root .
            python .survey/scripts/claim_worker_with_banks.py --repo-root .
            python .survey/scripts/refresh_queue_snapshot.py --repo-root .
            python .survey/scripts/ensure_dashboard_history.py --repo-root .
            python .survey/scripts/build_status_dashboard.py --repo-root . --output STATUS.md
            python .survey/scripts/append_research_throughput_status.py --repo-root . --status STATUS.md
            python .survey/scripts/refine_status_observability.py --repo-root . --status STATUS.md

            git add \
              STATUS.md \
              .survey/work-queue/jobs \
              .survey/work-queue/claims \
              .survey/work-queue/claim-results \
              .survey/work-queue/records \
              .survey/work-queue/next-jobs.json \
              .survey/work-queue/run-ledger.json \
              .survey/work-queue/discovery-state.json

            if git diff --cached --quiet; then
              echo 'Claim state already settled.'
              exit 0
            fi

            git commit -m 'survey-claim: allocate one-job claims and reserve banks'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Claim push race on attempt ${attempt}; recomputing from latest main."
            sleep $((attempt * 2))
          done

          echo 'Failed to publish claim results after 5 retries.' >&2
          exit 1
