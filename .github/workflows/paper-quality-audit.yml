name: Paper publication integrity audit

on:
  push:
    paths:
      - ".survey/scripts/audit_paper_quality.py"
      - ".survey/scripts/audit_list_summary_quality.py"
      - ".survey/scripts/list_summary.py"
      - ".survey/scripts/render_paper.py"
      - ".survey/scripts/japanese_style.py"
      - ".survey/scripts/paper_quality_gate.py"
      - ".survey/scripts/assemble_research_record.py"
      - ".survey/templates/paper.md"
      - ".survey/docs/survey-workflow/paper-quality-audit.md"
      - ".survey/tests/test_audit_paper_quality.py"
      - ".survey/tests/test_paper_quality_gate.py"
      - ".survey/tests/test_list_summary_quality.py"
      - ".survey/tests/test_render_paper_metadata.py"
      - "papers/inference/**/*.md"
      - "papers/training/**/*.md"
      - "papers/survey/**/*.md"
      - ".github/workflows/paper-quality-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Run active publication-integrity tests
        run: |
          python -m unittest discover -s .survey/tests -p 'test_*quality.py'
          python -m unittest discover -s .survey/tests -p 'test_render_paper_metadata.py'

      - name: Run repository publication-integrity and Japanese-ratio audit
        run: |
          mkdir -p audit-output
          python .survey/scripts/audit_paper_quality.py \
            --no-fail-exit \
            --markdown-out audit-output/paper-quality-audit.md \
            --json-out audit-output/paper-quality-audit.json

      - name: Run list-summary format and Japanese-ratio audit
        run: |
          python .survey/scripts/audit_list_summary_quality.py \
            --no-fail-exit \
            --markdown-out audit-output/list-summary-quality-audit.md \
            --json-out audit-output/list-summary-quality-audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: paper-publication-integrity-audit
          path: audit-output/
          retention-days: 7
