name: Temporary discovery final-gate patch

on:
  push:
    branches: [feat/discovery-resolver-windows]
    paths:
      - '.survey/scripts/apply_discovery_final_gate_patch.py'
      - '.github/workflows/tmp-apply-discovery-final-gate-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/discovery-resolver-windows
          fetch-depth: 0

      - name: Apply bounded patch
        run: python .survey/scripts/apply_discovery_final_gate_patch.py

      - name: Commit patched queue worker
        run: |
          set -euo pipefail
          if git diff --quiet -- .survey/scripts/queue_worker.py; then
            echo 'Queue worker already patched.'
            exit 0
          fi
          git config user.name 'discovery-feature-patch[bot]'
          git config user.email 'discovery-feature-patch[bot]@users.noreply.github.com'
          git add .survey/scripts/queue_worker.py
          git commit -m 'feat: apply represented-paper resolver at final discovery gate'
          git push origin HEAD:feat/discovery-resolver-windows
