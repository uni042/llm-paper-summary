name: Library import drain v2

on:
  push:
    branches: [main]
    paths:
      - '.survey/import-inbox/pending/**'
      - '.survey/import-inbox/waiting/**'
      - '.survey/scripts/process_library_import_inbox.py'
      - '.github/workflows/library-import-drain.yml'
  workflow_run:
    workflows: ['Survey claim fast lane']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '9/10 * * * *'

permissions:
  contents: write

concurrency:
  group: library-import-drain-v2-main
  cancel-in-progress: true

jobs:
  drain:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Drain Library import backlog in bounded checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-library-drain[bot]'
          git config user.email 'survey-library-drain[bot]@users.noreply.github.com'

          sync_main() {
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
          }

          publish() {
            local message="$1"
            shift
            git add -A -- "$@"
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "$message"
            git push origin HEAD:main
          }

          sync_main

          # Stage 1: bounded intake. Research is processed in small batches;
          # all Discovery pending files are durably moved to waiting, while at
          # most three waiting runs are advanced in this invocation.
          python .survey/scripts/process_library_import_inbox.py             --repo-root .             --max-research 5             --max-discovery 3
          python .survey/scripts/render_status_dashboard.py --repo-root . --output STATUS.md
          publish 'library-import-drain: checkpoint inbox progress'             .survey/import-inbox             .survey/work-queue/discovery-precheck             .survey/work-queue/reference-curation             .survey/work-queue/jobs             .survey/work-queue/next-jobs.json             .survey/work-queue/state.json             .survey/survey-state             papers README.md STATUS.md

          sync_main

          # Stage 2: resolve Library-generated Discovery identity prechecks.
          : > /tmp/library-import-prechecks.txt
          while IFS= read -r request; do
            [ -n "$request" ] || continue
            result=".survey/work-queue/discovery-precheck/results/$(basename "$request")"
            if [ ! -f "$result" ]; then
              printf '%s\n' "$request" >> /tmp/library-import-prechecks.txt
            fi
          done < <(
            find .survey/work-queue/discovery-precheck/requests               -maxdepth 1 -type f -name 'libimp-*-pre*.json' 2>/dev/null | sort
          )

          if [ -s /tmp/library-import-prechecks.txt ]; then
            rm -rf /tmp/library-import-identities
            rm -f /tmp/library-import-rejections.json
            python .survey/scripts/build_discovery_identity_snapshot.py               --root .survey               --output /tmp/library-import-identities               --source-commit "$(git rev-parse HEAD)"
            python .survey/scripts/build_discovery_rejection_ledger.py               --root .survey               --output /tmp/library-import-rejections.json

            set +e
            python .survey/scripts/process_discovery_precheck_batch.py               --repo-root .               --requests-file /tmp/library-import-prechecks.txt               --snapshot-dir /tmp/library-import-identities               --rejection-ledger /tmp/library-import-rejections.json               --parallelism 3
            precheck_rc=$?
            set -e
            if [ "$precheck_rc" -gt 1 ]; then
              exit "$precheck_rc"
            fi
          fi

          set +e
          python .survey/scripts/process_reference_relevance_requests.py --repo-root .
          relevance_rc=$?
          set -e

          publish 'library-import-drain: publish precheck and relevance results'             .survey/work-queue/discovery-precheck             .survey/work-queue/reference-curation

          sync_main

          # Stage 3: convert resolved Discovery runs to canonical submissions.
          python .survey/scripts/process_library_import_inbox.py             --repo-root .             --skip-research             --max-discovery 3
          publish 'library-import-drain: advance Discovery imports'             .survey/import-inbox             .survey/work-queue/submissions             .survey/work-queue/discovery-precheck             .survey/work-queue/reference-curation

          sync_main

          # Stage 4: execute only after submissions exist; queue_worker is
          # idempotent and current-main based.
          python .survey/scripts/queue_worker.py --root .survey
          publish 'library-import-drain: process Discovery submissions'             .survey/work-queue             .survey/survey-state             papers README.md STATUS.md

          sync_main

          # Stage 5: terminalize completed runs and publish the dashboard.
          python .survey/scripts/process_library_import_inbox.py             --repo-root .             --skip-research             --max-discovery 3
          python .survey/scripts/render_status_dashboard.py --repo-root . --output STATUS.md
          publish 'library-import-drain: settle and refresh STATUS'             .survey/import-inbox             .survey/work-queue             .survey/survey-state             papers README.md STATUS.md

          if [ "$relevance_rc" -ne 0 ]; then
            echo 'Some relevance requests remain retryable; durable progress was published.' >&2
          fi
