name: Temporary patch resumed assignment routing

on:
  push:
    branches:
      - fix/resume-active-scheduled-claim-20260914
    paths:
      - '.github/workflows/tmp-patch-assignment-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resume-active-scheduled-claim-20260914
          fetch-depth: 0
      - name: Preserve routing fields in recovered assignments
        shell: bash
        env:
          REPLACEMENT_B64: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re
          path = Path('.survey/scripts/claim_worker.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'def _assignment\(.*?\n\n\ndef _dependencies', re.DOTALL)
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'assignment helper matches={count}')
          path.write_text(patched, encoding='utf-8')
          PY
          python -m py_compile .survey/scripts/claim_worker.py
          rm .github/workflows/tmp-patch-assignment-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve transport routing on resumed claims'
          git push origin HEAD:fix/resume-active-scheduled-claim-20260914
