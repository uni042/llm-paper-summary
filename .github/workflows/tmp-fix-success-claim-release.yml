name: Temporary successful-result claim release fix

on:
  push:
    branches: [fix/repair-claim-record-recovery-20260913-run]
    paths:
      - '.github/workflows/tmp-fix-success-claim-release.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-claim-record-recovery-20260913-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt
      - name: Apply minimal claim release fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.survey/scripts/claim_worker.py')
          text = path.read_text(encoding='utf-8')
          marker = '''\ndef _release_durable_claims(\n    root: Path,\n    claims: dict[str, dict[str, Any]],\n    descriptors: list[dict[str, Any]],\n    now: dt.datetime,\n) -> set[str]:\n'''
          helper = '''\ndef _successful_immutable_attempts(root: Path) -> set[tuple[str, str]]:\n    """Return exact job/attempt pairs whose immutable processor result is successful."""\n    successful: set[tuple[str, str]] = set()\n    submissions = root / ".survey/work-queue/submissions"\n    results = root / ".survey/work-queue/results"\n    for kind in sorted(JOB_TYPES):\n        folder = submissions / kind\n        for path in sorted(folder.glob("*.json")) if folder.is_dir() else []:\n            descriptor = _read(path)\n            if not isinstance(descriptor, dict):\n                continue\n            job_id = descriptor.get("job_id")\n            attempt_id = descriptor.get("attempt_id")\n            if not isinstance(job_id, str) or not SAFE_ID_RE.fullmatch(job_id):\n                continue\n            if not isinstance(attempt_id, str) or not SAFE_ID_RE.fullmatch(attempt_id):\n                continue\n            result = _read(results / kind / path.name)\n            if immutable_submission.result_is_success_for(result, descriptor):\n                successful.add((job_id, attempt_id))\n    return successful\n\n\ndef _release_durable_claims(\n    root: Path,\n    claims: dict[str, dict[str, Any]],\n    descriptors: list[dict[str, Any]],\n    now: dt.datetime,\n) -> set[str]:\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one release marker, found {text.count(marker)}')
          text = text.replace(marker, helper)
          old = '''    durable_attempts = {\n        (str(item.get("job_id")), str(item.get("attempt_id")))\n        for item in descriptors\n    }\n'''
          new = '''    durable_attempts = {\n        (str(item.get("job_id")), str(item.get("attempt_id")))\n        for item in descriptors\n    }\n    durable_attempts |= _successful_immutable_attempts(root)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one durable_attempts block, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused RED-to-GREEN check
        run: python -m unittest discover -s .survey/tests -p 'test_claim_checkpoint_barrier.py'
      - name: Full verification
        run: |
          python -m compileall -q .survey/scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          python -m unittest discover -s .survey/tests -p 'test_*.py'
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .survey/scripts/claim_worker.py
          git diff --cached --check
          git commit -m 'fix: release claims after successful immutable results'
          git push origin HEAD:fix/repair-claim-record-recovery-20260913-run
