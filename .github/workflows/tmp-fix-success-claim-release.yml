name: Temporary successful-result claim release fix

on:
  push:
    branches: [fix/repair-claim-record-recovery-20260913-run]
    paths:
      - '.github/workflows/tmp-fix-success-claim-release.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-claim-record-recovery-20260913-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt
      - name: Apply minimal claim release fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.survey/scripts/claim_worker.py')
          text = path.read_text(encoding='utf-8')
          old = '''            result = _read(results / kind / path.name)\n            if immutable_submission.result_is_success_for(result, value):\n                continue\n            row = dict(value)\n            row["kind"] = value.get("kind") or kind\n            row["_failure_result_durable"] = bool(\n                immutable_submission.result_matches_identity(result, value)\n                and isinstance(result, dict)\n                and result.get("ok") is False\n            )\n            out.append(row)\n'''
          new = '''            result = _read(results / kind / path.name)\n            success_result_durable = immutable_submission.result_is_success_for(result, value)\n            failure_result_durable = bool(\n                immutable_submission.result_matches_identity(result, value)\n                and isinstance(result, dict)\n                and result.get("ok") is False\n            )\n            row = dict(value)\n            row["kind"] = value.get("kind") or kind\n            row["_success_result_durable"] = success_result_durable\n            row["_failure_result_durable"] = failure_result_durable\n            out.append(row)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one immutable descriptor block, found {text.count(old)}')
          text = text.replace(old, new)
          old2 = '''    submitted_jobs = {str(item.get("job_id")) for item in descriptors}\n    submitted_jobs -= _repair_jobs_with_only_durable_failures(root, descriptors)\n'''
          new2 = '''    submitted_jobs = {\n        str(item.get("job_id"))\n        for item in descriptors\n        if item.get("_success_result_durable") is not True\n    }\n    submitted_jobs -= _repair_jobs_with_only_durable_failures(root, descriptors)\n'''
          if text.count(old2) != 1:
              raise SystemExit(f'expected one submitted_jobs block, found {text.count(old2)}')
          text = text.replace(old2, new2)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused RED-to-GREEN check
        run: python -m unittest .survey/tests/test_claim_checkpoint_barrier.py
      - name: Full verification
        run: |
          python -m compileall -q .survey/scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          python -m unittest discover -s .survey/tests -p 'test_*.py'
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .survey/scripts/claim_worker.py
          git diff --cached --check
          git commit -m 'fix: release claims after successful immutable results'
          git push origin HEAD:fix/repair-claim-record-recovery-20260913-run
