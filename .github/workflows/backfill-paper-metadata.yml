name: Backfill paper metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backfill-paper-metadata.yml
      - .survey/scripts/backfill_paper_metadata.py

permissions:
  contents: write

concurrency:
  group: survey-helper-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r .survey/scripts/requirements.txt

      - name: Backfill metadata from body and arXiv
        shell: bash
        run: |
          set -euo pipefail
          python .survey/scripts/backfill_paper_metadata.py --repo-root .

      - name: Rebuild and validate metadata
        shell: bash
        run: |
          set -euo pipefail
          python .survey/scripts/audit_metadata_coverage.py --repo-root . --json-out .survey/reports/metadata-coverage-latest.json --strict
          python .survey/scripts/survey.py --root .survey build
          python .survey/scripts/refresh_frozen_training.py --repo-root . --source metadata-backfill-2026-09-11
          python -m unittest discover -s .survey/tests -p 'test_*.py'
          python .survey/scripts/build_repository_inventory.py --root . --output /tmp/repo-inventory.json --source-commit metadata-backfill-working-tree
          set +e
          python .survey/scripts/check_repository.py --root . --inventory /tmp/repo-inventory.json --report .survey/reports/consistency-latest.json
          rc=$?
          set -e
          cat .survey/reports/consistency-latest.json
          exit "$rc"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No metadata changes.'
            exit 0
          fi
          git commit -m 'survey: validate completed metadata backfill'
          git pull --rebase origin main
          git push origin HEAD:main
