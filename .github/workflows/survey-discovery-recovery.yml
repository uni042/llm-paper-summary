name: Survey Discovery recovery

on:
  push:
    branches: [main]
    paths:
      # Current Discovery descriptors live one level below submissions/.
      # Keep the legacy root glob for read-compatibility, but trigger immediately
      # for the canonical nested Discovery path so workers do not wait for the
      # 10-minute scheduled recovery after every submission.
      - '.survey/work-queue/submissions/discovery/*.json'
      - '.survey/work-queue/submissions/*.json'
  workflow_dispatch:
  schedule:
    - cron: '5/10 * * * *'

permissions:
  contents: write

# Share the background serialization domain with survey-helper so Discovery recovery
# cannot race its queue/state writer.
concurrency:
  group: survey-background-main
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install survey dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Recover stale Discovery submissions
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_SNAPSHOT='.survey/work-queue/next-jobs.json'
          DERIVED_HOT_DISPATCH='.survey/work-queue/hot-dispatch.json'

          git config user.name 'survey-discovery-recovery[bot]'
          git config user.email 'survey-discovery-recovery[bot]@users.noreply.github.com'

          # Discovery completion can reserve the next prepared bank. Recompute the
          # whole recovery/advance transaction after a push race so a preload that
          # another worker took meanwhile is never published as a double claim.
          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main

            python .survey/scripts/recover_discovery_submissions.py --root .survey \
              > /tmp/discovery-recovery.json
            cat /tmp/discovery-recovery.json

            python .survey/scripts/auto_advance_discovery.py \
              --repo-root . \
              --recovery-report /tmp/discovery-recovery.json \
              > /tmp/discovery-auto-advance.json
            cat /tmp/discovery-auto-advance.json

            python .survey/scripts/refresh_queue_snapshot.py --repo-root .
            python .survey/scripts/hot_dispatch.py --repo-root . refresh > /tmp/hot-dispatch.json
            python .survey/scripts/render_status_dashboard.py --repo-root . --output STATUS.md

            git add -A \
              STATUS.md \
              .survey/work-queue/jobs \
              .survey/work-queue/results \
              .survey/work-queue/state.json \
              .survey/work-queue/discovery-state.json \
              .survey/work-queue/discovery-preload \
              .survey/work-queue/discovery-precheck \
              .survey/work-queue/direct-take-results/discovery \
              .survey/work-queue/run-state \
              .survey/work-queue/records \
              .survey/work-queue/lineage-proposals \
              .survey/config/promoted-inference-lineages.json \
              papers/inference \
              .survey/work-queue/hot-dispatch.json \
              "$DERIVED_SNAPSHOT"

            if git diff --cached --quiet; then
              echo 'Discovery recovery and next-bank advancement are already settled.'
              exit 0
            fi

            git commit -m 'survey-discovery-recovery: settle rounds and advance prepared bank'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Discovery recovery push race on attempt ${attempt}; recomputing from latest main."
            backoff=$(( attempt * 2 ))
            if [ "$backoff" -gt 12 ]; then backoff=12; fi
            sleep "$backoff"
          done

          echo 'Failed to publish Discovery recovery after 12 recomputation attempts.' >&2
          exit 1
