name: Survey Discovery recovery

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/submissions/*.json'
  workflow_dispatch:
  schedule:
    - cron: '5/10 * * * *'

permissions:
  contents: write

# Share the background serialization domain with survey-helper so Discovery recovery
# cannot race its queue/state writer.
concurrency:
  group: survey-background-main
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install survey dependencies
        run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt

      - name: Recover stale Discovery submissions
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_SNAPSHOT='.survey/work-queue/next-jobs.json'
          DERIVED_HOT_DISPATCH='.survey/work-queue/hot-dispatch.json'

          git config user.name 'survey-discovery-recovery[bot]'
          git config user.email 'survey-discovery-recovery[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main

          python .survey/scripts/recover_discovery_submissions.py --root .survey
          python .survey/scripts/refresh_queue_snapshot.py --repo-root .
          python .survey/scripts/hot_dispatch.py --repo-root . refresh > /tmp/hot-dispatch.json

          git add -A \
            .survey/work-queue/jobs \
            .survey/work-queue/results \
            .survey/work-queue/state.json \
            .survey/work-queue/discovery-state.json \
            .survey/work-queue/discovery-preload \
            .survey/work-queue/records \
            .survey/work-queue/hot-dispatch.json \
            "$DERIVED_SNAPSHOT"

          if git diff --cached --quiet; then
            echo 'No stale Discovery submissions require recovery.'
            exit 0
          fi

          git commit -m 'survey-discovery-recovery: replay stale discovery payloads'

          recover_derived_snapshot_conflict() {
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            if [ "${#conflicts[@]}" -eq 0 ]; then
              return 0
            fi

            for conflict in "${conflicts[@]}"; do
              case "$conflict" in
                "$DERIVED_SNAPSHOT"|"$DERIVED_HOT_DISPATCH") ;;
                *)
                  echo 'Rebase conflict touches durable/non-derived state; refusing automatic resolution.' >&2
                  printf 'Unmerged paths: %s\n' "${conflicts[*]:-none}" >&2
                  if git rev-parse --verify -q REBASE_HEAD >/dev/null; then
                    git rebase --abort || true
                  fi
                  return 1
                  ;;
              esac
            done

            echo 'Resolving rebuildable queue snapshot / hot-dispatch conflicts from latest main.'
            # Both files are rebuildable indexes. Keep the freshly fetched main
            # version during rebase, then regenerate them from the rebased
            # durable jobs/state before publication.
            for conflict in "${conflicts[@]}"; do
              git checkout --ours -- "$conflict"
              git add "$conflict"
            done
            if git diff --cached --quiet; then
              git rebase --skip
            else
              GIT_EDITOR=true git rebase --continue
            fi
          }

          refresh_derived_snapshot() {
            python .survey/scripts/refresh_queue_snapshot.py --repo-root .
            python .survey/scripts/hot_dispatch.py --repo-root . refresh > /tmp/hot-dispatch-after-rebase.json
            if git diff --quiet -- "$DERIVED_SNAPSHOT" "$DERIVED_HOT_DISPATCH"; then
              return 0
            fi

            git add "$DERIVED_SNAPSHOT" "$DERIVED_HOT_DISPATCH"
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              git commit -m 'survey-discovery-recovery: refresh derived indexes after rebase'
            else
              git commit --amend --no-edit
            fi
          }

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              recover_derived_snapshot_conflict || exit 1
            fi
            refresh_derived_snapshot

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Discovery recovery push race on attempt ${attempt}; rebasing the prepared recovery commit."
            sleep $((attempt * 2))
          done

          echo 'Failed to publish Discovery recovery after 5 non-fast-forward recovery attempts.' >&2
          exit 1
