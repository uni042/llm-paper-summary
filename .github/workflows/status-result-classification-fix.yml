name: Publish validated STATUS classification fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/status-result-classification-fix.yml']
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Cherry-pick validated fix and remove temporary workflow
        run: |
          git config user.name 'status-maintenance[bot]'
          git config user.email 'status-maintenance[bot]@users.noreply.github.com'
          git fetch origin status-fix-result-classification-20260919
          git cherry-pick 35a4eecef54d0f8fbaf826d11d76fa520f2c0544
          git rm .github/workflows/status-result-classification-fix.yml
          git commit -m 'chore: remove temporary STATUS fix validator'
          git push origin HEAD:main
