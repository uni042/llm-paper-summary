name: Temporary fix claim resume indentation

on:
  push:
    branches:
      - fix/resume-active-scheduled-claim-20260914
    paths:
      - '.github/workflows/tmp-fix-resume-indent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resume-active-scheduled-claim-20260914
          fetch-depth: 0
      - name: Fix indentation and verify syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('.survey/scripts/claim_worker.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'        if request\["worker_kind"\] == "scheduled_chat" and _worker_has_active_claim\(\n'
              r'.*?'
              r'checkpointed_ids = set\(_checkpoint_map\(request\)\)',
              re.DOTALL,
          )
          body = '''if request["worker_kind"] == "scheduled_chat" and _worker_has_active_claim(
    claims,
    worker_id=request["worker_id"],
    worker_kind=request["worker_kind"],
):
    resumed = []
    new_expiry = _iso(now + dt.timedelta(seconds=request["lease_seconds"]))
    for job_id, current in claims.items():
        if not (
            current.get("active")
            and current.get("worker_id") == request["worker_id"]
            and current.get("worker_kind") == request["worker_kind"]
            and job_id in by_id
        ):
            continue
        claim = {key: value for key, value in current.items() if key not in {"active", "expired"}}
        claim["expires_at"] = new_expiry
        claim["heartbeat_at"] = _iso(now)
        _write(claims_root / f"{job_id}.json", claim)
        claims[job_id] = dict(claim, active=True, expired=False)
        resumed.append(_assignment(by_id[job_id], claim))

    if resumed:
        _write(result_path, {
            "schema_version": 1, "workflow_version": 10, "request_id": request["request_id"],
            "worker_id": request["worker_id"], "worker_kind": request["worker_kind"],
            "ok": True, "assignments": resumed, "processed_at": _iso(now),
            "reason": "resumed active unsubmitted claim",
            "checkpoint_released": released_now,
        })
        assigned_recovered += len(resumed)
        renewed += len(resumed)
        processed += 1
        continue

checkpointed_ids = set(_checkpoint_map(request))'''
          replacement = textwrap.indent(body, '        ')
          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'target block matches={count}')
          path.write_text(patched, encoding='utf-8')
          PY
          python -m py_compile .survey/scripts/claim_worker.py
          rm .github/workflows/tmp-fix-resume-indent.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct scheduled claim resume implementation'
          git push origin HEAD:fix/resume-active-scheduled-claim-20260914
