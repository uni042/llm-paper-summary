name: Temporary repair Vortex record

on:
  push:
    branches: [fix/validation-preflight-and-claim-telemetry-20260913]
    paths:
      - '.github/workflows/tmp-diagnose-vortex-current-record.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validation-preflight-and-claim-telemetry-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r .survey/scripts/requirements.txt
      - name: Repair and process Vortex immutable record
        run: python .survey/scripts/tmp_repair_vortex.py
      - name: Verify repository Python and YAML
        run: |
          python -m compileall -q .survey/scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print('workflow YAML valid')
          PY
      - name: Commit repaired durable state
        run: |
          set -euo pipefail
          git config user.name 'vortex-repair[bot]'
          git config user.email 'vortex-repair[bot]@users.noreply.github.com'
          git status --short
          git add \
            .survey/work-queue/records/chat-record-h \
            .survey/work-queue/claims/job-research-8df4b126a68a6be4.json \
            .survey/work-queue/submissions/research/attempt-manual-vortex-repair-20260914-001.json \
            .survey/work-queue/results/research/attempt-manual-vortex-repair-20260914-001.json \
            .survey/work-queue/jobs/job-research-8df4b126a68a6be4.json \
            .survey/work-queue/state.json \
            .survey/work-queue/next-jobs.json \
            .survey/survey-state/identity-deltas \
            papers/inference/07-kv-cache-optimization-compression/2026-2606.06453-vortex-programmable-sparse-attention-serving.md
          git diff --cached --check
          git commit -m 'repair: complete Vortex record under current validator'
          git push origin HEAD:fix/validation-preflight-and-claim-telemetry-20260913
