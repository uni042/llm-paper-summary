name: Apply submission recovery patch

on:
  push:
    branches:
      - fix/submission-recovery-main-20260916
    paths:
      - '.survey/scripts/_apply_submission_recovery_patch.py'
      - '.github/workflows/apply-submission-recovery-patch.yml'

permissions:
  contents: write

concurrency:
  group: apply-submission-recovery-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/submission-recovery-main-20260916
          fetch-depth: 0

      - name: Apply bounded replacements
        run: python .survey/scripts/_apply_submission_recovery_patch.py

      - name: Remove temporary patch lane and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .survey/scripts/_apply_submission_recovery_patch.py
          rm .github/workflows/apply-submission-recovery-patch.yml
          git config user.name 'survey-repair[bot]'
          git config user.email 'survey-repair[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover immutable submissions from safe interruption points'
          git push origin HEAD:fix/submission-recovery-main-20260916
