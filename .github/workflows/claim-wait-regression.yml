name: claim-wait-regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run claim-wait regression tests
        shell: bash
        run: |
          set +e
          python .survey/tests/test_continuation_gate_claim_wait.py
          first=$?
          python .survey/tests/test_run_finalization_gate.py
          second=$?
          if [ "$first" -ne 0 ] || [ "$second" -ne 0 ]; then
            exit 1
          fi
