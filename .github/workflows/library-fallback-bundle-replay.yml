name: Library fallback bundle replay

on:
  push:
    branches: [main]
    paths:
      - '.survey/work-queue/library-replay-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-library-fallback-bundle-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay exact Library payloads safely
        run: |
          python - <<'PY'
          import base64, io, json, pathlib, tarfile, hashlib
          q = pathlib.Path('.survey/work-queue')
          source = None
          expected_payload_count = None
          expected_id_list_sha256 = None
          v2 = q / 'library-replay-chunks-v2'
          v2_parts = sorted(v2.glob('part-*.txt')) if v2.is_dir() else []
          if v2_parts:
              meta_path = v2 / 'meta.json'
              if not meta_path.is_file():
                  raise SystemExit('v2 chunk metadata missing')
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              expected_parts = meta.get('parts')
              if len(v2_parts) != expected_parts:
                  raise SystemExit(f'v2 part count mismatch: {len(v2_parts)} != {expected_parts}')
              expected_names = [f'part-{i:02d}.txt' for i in range(expected_parts)]
              if [p.name for p in v2_parts] != expected_names:
                  raise SystemExit('v2 part sequence mismatch')
              full_size = meta.get('full_part_size')
              last_size = meta.get('last_part_size')
              for i, p in enumerate(v2_parts):
                  want = last_size if i == len(v2_parts) - 1 else full_size
                  if p.stat().st_size != want:
                      raise SystemExit(f'v2 part size mismatch: {p.name}: {p.stat().st_size} != {want}')
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in v2_parts)
              if len(encoded) != meta.get('encoded_length'):
                  raise SystemExit('v2 encoded length mismatch')
              raw = base64.b64decode(encoded, validate=True)
              if len(raw) != meta.get('archive_size'):
                  raise SystemExit('v2 archive size mismatch')
              archive_sha256 = hashlib.sha256(raw).hexdigest()
              if archive_sha256 != meta.get('archive_sha256'):
                  raise SystemExit('v2 archive sha256 mismatch')
              expected_payload_count = meta.get('payload_count')
              expected_id_list_sha256 = meta.get('payload_id_list_sha256')
              source = 'library-replay-chunks-v2'
          else:
              binary_parts = sorted(q.glob('library-replay-binary.part-*'))
              if binary_parts:
                  raw = b''.join(p.read_bytes() for p in binary_parts)
                  manifest_path = q/'library-replay-binary-manifest.json'
                  if manifest_path.is_file():
                      manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
                      if len(binary_parts) != manifest.get('part_count'):
                          raise SystemExit('binary bundle part count mismatch')
                      if hashlib.sha256(raw).hexdigest() != manifest.get('sha256'):
                          raise SystemExit('binary bundle sha256 mismatch')
                  source = 'library-replay-binary'
              else:
                  parts = sorted(q.glob('library-replay-bundle.part-*'))
                  if not parts:
                      raise SystemExit('bundle parts missing')
                  encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
                  raw = base64.b64decode(encoded, validate=True)
                  source = 'library-replay-bundle'
              archive_sha256 = hashlib.sha256(raw).hexdigest()

          payloads = []
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:*') as tf:
              members = [m for m in tf.getmembers() if m.isfile()]
              if expected_payload_count is not None and len(members) != expected_payload_count:
                  raise SystemExit(f'v2 payload count mismatch: {len(members)} != {expected_payload_count}')
              for member in members:
                  if '/' in member.name or not member.name.endswith('.json'):
                      raise SystemExit(f'unsafe bundle member: {member.name!r}')
                  data = tf.extractfile(member).read()
                  obj = json.loads(data)
                  if not isinstance(obj, dict):
                      raise SystemExit(f'payload is not object: {member.name}')
                  envelope_id = obj.get('id')
                  if member.name != f'{envelope_id}.json':
                      raise SystemExit(f'filename/id mismatch: {member.name}')
                  for key in ('id','kind','job_id','attempt_id'):
                      if not isinstance(obj.get(key), str) or not obj[key]:
                          raise SystemExit(f'missing identity {key}: {member.name}')
                  if not isinstance(obj.get('writes'), list) or len(obj['writes']) < 5:
                      raise SystemExit(f'incomplete writes: {member.name}')
                  payloads.append((member.name, data, obj))

          ids = [obj['id'] for _, _, obj in payloads]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate envelope id in bundle')
          id_list_sha256 = hashlib.sha256(('\n'.join(sorted(ids))).encode('utf-8')).hexdigest()
          if expected_id_list_sha256 is not None and id_list_sha256 != expected_id_list_sha256:
              raise SystemExit('v2 payload id-list sha256 mismatch')

          added, skipped, conflicts = [], [], []
          for member_name, data, obj in payloads:
              envelope_id = obj['id']
              found = [q/d/member_name for d in ('fallback-inbox','fallback-archive','fallback-failed') if (q/d/member_name).is_file()]
              if found:
                  mismatch=[]
                  for p in found:
                      try:
                          same = json.loads(p.read_text(encoding='utf-8')) == obj
                      except Exception:
                          same = False
                      if not same:
                          mismatch.append(str(p))
                  if mismatch:
                      conflicts.append({'id':envelope_id,'paths':mismatch})
                  else:
                      skipped.append(envelope_id)
                  continue
              dest=q/'fallback-inbox'/member_name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
              added.append(envelope_id)

          report={
              'schema_version':2,
              'source': source,
              'archive_sha256': archive_sha256,
              'payload_id_list_sha256': id_list_sha256,
              'bundle_count': len(payloads),
              'added':added,
              'already_present_same_payload':skipped,
              'conflicts_not_overwritten':conflicts,
              'status':'completed_with_conflicts' if conflicts else 'completed',
          }
          (q/'library-replay-last-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit replayed payloads and conflict report
        run: |
          git config user.name 'survey-helper[bot]'
          git config user.email 'survey-helper[bot]@users.noreply.github.com'
          git add .survey/work-queue/fallback-inbox .survey/work-queue/library-replay-last-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'survey: replay durable Library fallback payloads'
          git pull --rebase origin main
          git push origin HEAD:main
