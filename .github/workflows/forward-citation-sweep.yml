name: Forward citation coverage sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forward-citation-sweep.yml'
      - '.survey/config/forward-citation-sweep.json'
      - '.survey/scripts/refresh_due.py'
      - '.survey/scripts/discovery_provider_adapter.py'
      - '.survey/scripts/forward_citation_sweep.py'
      - '.survey/tests/test_forward_citation_sweep.py'
      - '.survey/tests/test_discovery_provider_adapter.py'
  schedule:
    # Redundant low-frequency fallback for GitHub scheduler delivery issues.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: forward-citation-coverage-main-v3
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether forward citation refresh is due
        id: due
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            due=true
            echo "Implementation/config push: force one real citation sweep for validation."
          else
            due=$(python .survey/scripts/refresh_due.py \
              --state .survey/work-queue/forward-citation-sweep.json \
              --max-age-seconds 3000)
          fi
          echo "run=${due}" >> "$GITHUB_OUTPUT"
          echo "forward_citation_refresh_due=${due}"
      - name: Install runtime dependencies
        if: steps.due.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Forward citation coverage regression tests
        if: steps.due.outputs.run == 'true'
        run: |
          python -m unittest discover -s .survey/tests -p 'test_forward_citation_sweep.py'
          python -m unittest discover -s .survey/tests -p 'test_discovery_provider_adapter.py'
      - name: Refresh full forward-citation coverage
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          git reset --hard origin/main

          # Provider traffic happens exactly once per workflow run. Push races
          # are resolved by rebasing this generated state, never by re-querying.
          python .survey/scripts/forward_citation_sweep.py --repo-root . | tee /tmp/forward-citation-sweep.json

          git add -A .survey/work-queue/forward-citation-sweep.json
          if git diff --cached --quiet; then
            echo 'Forward-citation coverage state already current.'
            exit 0
          fi

          git commit -m 'survey: refresh forward citation coverage'

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo 'State published; dispatching STATUS dashboard refresh.'
              GH_TOKEN="${{ github.token }}" gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/status-dashboard.yml/dispatches" \
                -f ref=main
              exit 0
            fi
            echo "Push race on attempt ${attempt}; rebasing generated citation state onto latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Citation state conflicts with a newer canonical state; defer to the next hourly sweep.' >&2
              exit 1
            fi
          done

          echo 'Failed to publish forward-citation state after rebasing retries.' >&2
          exit 1
