name: Forward citation coverage sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forward-citation-sweep.yml'
      - '.survey/config/candidate-priority.json'
      - '.survey/config/forward-citation-sweep.json'
      - '.survey/scripts/candidate_priority.py'
      - '.survey/scripts/refresh_candidate_priority.py'
      - '.survey/scripts/forward_citation_sweep.py'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-citation-coverage-main
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Refresh full forward-citation coverage and priority metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python .survey/scripts/forward_citation_sweep.py --repo-root . | tee /tmp/forward-citation-sweep.json
            python .survey/scripts/refresh_candidate_priority.py --repo-root . | tee /tmp/candidate-priority-refresh.json
            python .survey/scripts/build_worker_worklist.py --repo-root .

            git add -A               .survey/work-queue/forward-citation-sweep.json               .survey/work-queue/candidate-priority-cache.json               .survey/work-queue/jobs               .survey/work-queue/WORKLIST-00.md               .survey/work-queue/WORKLIST-30.md               .survey/work-queue/WORKLIST-45.md               .survey/work-queue/worker-worklist-00.json               .survey/work-queue/worker-worklist-30.json               .survey/work-queue/worker-worklist-45.json

            if git diff --cached --quiet; then
              echo 'Forward-citation coverage and candidate priorities already current.'
              exit 0
            fi

            git commit -m 'survey: refresh forward citations and candidate priorities'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict on attempt ${attempt}; recomputing from latest main."
            sleep $((attempt * 2))
          done

          echo 'Failed to publish forward-citation sweep after retries.' >&2
          exit 1
