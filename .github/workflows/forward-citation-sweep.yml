name: Forward citation coverage sweep

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forward-citation-sweep.yml'
      - '.survey/config/candidate-priority.json'
      - '.survey/config/forward-citation-sweep.json'
      - '.survey/scripts/candidate_priority.py'
      - '.survey/scripts/discovery_provider_adapter.py'
      - '.survey/scripts/forward_citation_sweep.py'
      - '.survey/scripts/refresh_candidate_priority.py'
      - '.survey/scripts/build_worker_worklist.py'
      - '.survey/tests/test_candidate_priority.py'
      - '.survey/tests/test_forward_citation_sweep.py'
      - '.survey/tests/test_discovery_provider_adapter.py'
      - '.survey/tests/test_queue_worker_metadata.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-citation-coverage-main
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Citation priority regression tests
        run: |
          python -m unittest discover -s .survey/tests -p 'test_candidate_priority.py'
          python -m unittest discover -s .survey/tests -p 'test_forward_citation_sweep.py'
          python -m unittest discover -s .survey/tests -p 'test_discovery_provider_adapter.py'
          python -m unittest discover -s .survey/tests -p 'test_queue_worker_metadata.py'
      - name: Refresh full forward-citation coverage and priority metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          git reset --hard origin/main

          # External providers are queried exactly once per workflow run. A push
          # race is resolved by rebasing this generated commit, not by repeating
          # Semantic Scholar/OpenAlex traffic.
          python .survey/scripts/forward_citation_sweep.py --repo-root . | tee /tmp/forward-citation-sweep.json
          python .survey/scripts/refresh_candidate_priority.py --repo-root . | tee /tmp/candidate-priority-refresh.json

          git add -A \
            .survey/work-queue/forward-citation-sweep.json \
            .survey/work-queue/candidate-priority-cache.json \
            .survey/work-queue/jobs

          if git diff --cached --quiet; then
            echo 'Forward-citation coverage and candidate priorities already current.'
            exit 0
          fi

          git commit -m 'survey: refresh forward citations and candidate priorities'

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race on attempt ${attempt}; rebasing generated state onto latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Generated state conflicts with newer canonical queue state; leave it for the next scheduled sweep rather than repeating provider calls.' >&2
              exit 1
            fi
          done

          echo 'Failed to publish forward-citation sweep after rebasing retries.' >&2
          exit 1
